<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meetings — Meridian PJM</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="shared/pjm.css">
<style>
/* ── Module tabs ── */
.mod-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border,#e5e7eb);margin-bottom:16px;background:#fff;border-radius:12px 12px 0 0;padding:0 4px;}
.mod-tab{padding:11px 18px;border:none;background:none;font-size:13px;font-weight:600;color:var(--muted,#6b7280);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;white-space:nowrap;}
.mod-tab.active{color:#3B82F6;border-bottom-color:#3B82F6;}
.mod-tab:hover:not(.active){color:#374151;}
.tab-cnt{background:#f3f4f6;color:#9ca3af;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:5px;}
.mod-tab.active .tab-cnt{background:#dbeafe;color:#3B82F6;}

/* ── Calendar tab ── */
.next-strip{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:linear-gradient(135deg,#1E40AF,#4F46E5);color:#fff;border-radius:12px;padding:14px 20px;margin-bottom:14px;}
.ns-left{flex:1;min-width:180px;}
.ns-label{font-size:10px;font-weight:700;opacity:.75;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
.ns-title{font-size:15px;font-weight:800;line-height:1.2;}
.ns-time{font-size:11px;opacity:.8;margin-top:3px;}
.cntdown{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:800;white-space:nowrap;flex-shrink:0;}
.tdy-cnt{font-size:12px;opacity:.8;white-space:nowrap;flex-shrink:0;}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;margin-right:5px;}

/* ── Week day pills ── */
.week-pills{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap;}
.day-pill{padding:8px 12px;border-radius:20px;border:1px solid var(--border,#e5e7eb);background:#fff;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted,#6b7280);transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:56px;}
.day-pill:hover:not(.active){background:#f9fafb;}
.day-pill.today{border-color:#3B82F6;color:#3B82F6;}
.day-pill.active{background:#3B82F6;color:#fff;border-color:#3B82F6;}
.dp-num{font-size:10px;font-weight:500;opacity:.7;}
.dp-dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.55;}

/* ── Calendar layout ── */
.cal-layout{display:flex;gap:16px;align-items:flex-start;}
.cal-main{flex:1;min-width:0;}
.cal-aside{width:380px;flex-shrink:0;}

/* ── Meeting cards ── */
.mc{background:#fff;border:1px solid var(--border,#e5e7eb);border-radius:10px;padding:13px 15px;margin-bottom:8px;cursor:pointer;transition:box-shadow .15s,border-color .15s;display:flex;gap:12px;align-items:flex-start;}
.mc:hover{box-shadow:0 2px 10px rgba(0,0,0,.06);}
.mc.mc-past{opacity:.68;}
.mc.mc-sel{border-color:#3B82F6;box-shadow:0 0 0 2px rgba(59,130,246,.13);opacity:1;}
.mc-time-col{display:flex;flex-direction:column;align-items:flex-end;min-width:68px;flex-shrink:0;padding-top:1px;}
.mc-time{font-size:13px;font-weight:800;color:#3B82F6;white-space:nowrap;}
.mc-dur{font-size:10px;color:var(--muted,#6b7280);margin-top:2px;}
.mc-body{flex:1;min-width:0;}
.mc-title{font-size:13px;font-weight:700;color:#111827;margin-bottom:5px;line-height:1.3;}
.mc-chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.chip{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;white-space:nowrap;}
.chip-proj{background:#ede9fe;color:#6d28d9;}
.chip-rec{background:#dcfce7;color:#15803d;}
.chip-note{background:#fef9c3;color:#92400e;}
.chip-att{background:#f3f4f6;color:#6b7280;}
.mc-join{padding:5px 11px;border:1px solid #10b981;border-radius:7px;background:#fff;font-size:11px;font-weight:700;color:#10b981;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap;flex-shrink:0;margin-left:auto;align-self:flex-start;}
.mc-join:hover{background:#f0fdf4;}

/* ── Detail drawer ── */
.detail-drawer{background:#fff;border:1px solid var(--border,#e5e7eb);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 160px);position:sticky;top:20px;}
.dd-head{padding:15px 40px 12px 18px;border-bottom:1px solid var(--border,#e5e7eb);position:relative;}
.dd-head-title{font-size:14px;font-weight:800;color:#111827;line-height:1.3;margin-bottom:4px;}
.dd-head-meta{font-size:11px;color:var(--muted,#6b7280);}
.dd-close{position:absolute;right:14px;top:14px;background:none;border:none;font-size:17px;color:#9ca3af;cursor:pointer;line-height:1;padding:2px;}
.dd-close:hover{color:#374151;}
.dd-body{padding:15px 18px;overflow-y:auto;flex:1;}
.sec-lbl{font-size:10px;font-weight:800;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px;}
.sec-lbl:first-child{margin-top:0;}
.att-row{display:flex;flex-wrap:wrap;gap:4px;}
.att-chip{font-size:10px;background:#f3f4f6;padding:2px 8px;border-radius:8px;color:#374151;}
.desc-box{font-size:11px;color:#374151;line-height:1.6;background:#f9fafb;border-radius:6px;padding:8px 10px;max-height:90px;overflow-y:auto;white-space:pre-wrap;}
.al-green{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:700;text-decoration:none;border:1px solid #10b981;color:#10b981;background:#f0fdf4;margin-bottom:12px;}
.al-green:hover{background:#dcfce7;}
.asset-card{border-radius:8px;padding:11px 13px;display:flex;align-items:center;gap:10px;margin-bottom:5px;}
.asset-card.note-c{background:#fefce8;border:1px solid #fde68a;}
.asset-card.rec-c{background:#f0fdf4;border:1px solid #a7f3d0;}
.ac-icon{font-size:22px;flex-shrink:0;}
.ac-info{flex:1;min-width:0;}
.ac-title{font-size:11px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.note-c .ac-title{color:#78350f;}
.rec-c  .ac-title{color:#065f46;}
.ac-sub{font-size:10px;color:var(--muted,#6b7280);margin-top:2px;}
.ac-open{font-size:11px;font-weight:700;text-decoration:none;white-space:nowrap;flex-shrink:0;}
.note-c .ac-open{color:#d97706;}
.rec-c  .ac-open{color:#10b981;}
.ac-open:hover{text-decoration:underline;}
.no-asset{font-size:11px;color:#9ca3af;background:#f9fafb;border-radius:6px;padding:8px 10px;}

/* ── Notes & Recordings tabs (grid tiles) ── */
.grid-tip{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:13px 16px;margin-bottom:16px;font-size:12px;color:#1d4ed8;line-height:1.55;}
.rec-grid,.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
.rec-tile,.note-tile{background:#fff;border:1px solid var(--border,#e5e7eb);border-radius:12px;padding:18px;transition:box-shadow .15s;}
.rec-tile:hover,.note-tile:hover{box-shadow:0 3px 12px rgba(0,0,0,.07);}
.tile-icon{font-size:28px;margin-bottom:10px;}
.tile-title{font-size:13px;font-weight:700;color:#111827;line-height:1.35;margin-bottom:5px;}
.tile-date{font-size:11px;color:var(--muted,#6b7280);margin-bottom:4px;}
.tile-size{font-size:10px;color:var(--muted,#6b7280);background:#f3f4f6;padding:2px 8px;border-radius:6px;display:inline-block;margin-bottom:14px;}
.rec-btn{display:block;width:100%;padding:9px;background:#f0fdf4;border:1px solid #a7f3d0;border-radius:8px;font-size:12px;font-weight:700;color:#15803d;text-align:center;text-decoration:none;transition:background .15s;}
.rec-btn:hover{background:#dcfce7;}
.tile-summary{font-size:11px;color:#4b5563;line-height:1.5;margin-bottom:12px;background:#f9fafb;border-radius:6px;padding:7px 9px;}
.note-btn{display:block;width:100%;padding:9px;background:#fefce8;border:1px solid #fde68a;border-radius:8px;font-size:12px;font-weight:700;color:#92400e;text-align:center;text-decoration:none;transition:background .15s;}
.note-btn:hover{background:#fef3c7;}

/* ── Empty & pump nudge ── */
.empty-day{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;gap:10px;color:var(--muted,#6b7280);background:#fff;border:1px solid var(--border,#e5e7eb);border-radius:12px;padding:40px;text-align:center;}
.pump-nudge{font-size:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:10px 14px;color:#92400e;margin-top:12px;}
/* ── "No sync yet" banner ── */
.no-data-banner{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:18px 22px;margin-bottom:16px;display:flex;align-items:flex-start;gap:14px;}
.ndb-icon{font-size:28px;flex-shrink:0;line-height:1;}
.ndb-body{flex:1;}
.ndb-title{font-size:14px;font-weight:800;color:#92400e;margin-bottom:4px;}
.ndb-text{font-size:12px;color:#78350f;line-height:1.65;}
.ndb-steps{font-size:12px;color:#78350f;margin-top:6px;padding-left:16px;}
.ndb-steps li{margin-bottom:2px;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:12px 24px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:500px;}
.toast.show{opacity:1;}

@media(max-width:920px){.cal-layout{flex-direction:column;}.cal-aside{width:100%;}.detail-drawer{position:static;max-height:none;}}
@media(max-width:600px){.rec-grid,.notes-grid{grid-template-columns:1fr;}}
</style>

<style id="demoBannerCss">
#pjmDemoBanner{position:fixed;top:0;left:0;right:0;z-index:99999;background:#8A5CFF;color:#fff;

 letter-spacing:.2px;box-shadow:0 1px 6px rgba(0,0,0,.18)}
#pjmDemoBanner a{color:#fff;text-decoration:underline}

body.has-demo-banner{padding-top:30px}
</style>
<script id="pjmDemoMode">
/* ===== PUBLIC DEMO BUILD =====
   All data in this build is fictional. No credentials ship with it and no
   outbound calls to third-party APIs are permitted. */
(function(){
  window.PJM_DEMO = true;
  var BLOCK = /(api\.linear\.app|api\.github\.com|graphql|googleapis\.com|slack\.com|atlassian\.net)/i;
  var of = window.fetch;
  window.fetch = function(input){
    var u = (typeof input === 'string') ? input : (input && input.url) || '';
    if (BLOCK.test(u)) {
      console.info('[demo] blocked outbound call:', u);
      return Promise.resolve(new Response(JSON.stringify({data:null,demo:true}),
        {status:200, headers:{'Content-Type':'application/json'}}));
    }
    return of.apply(this, arguments);
  };
  var ox = window.XMLHttpRequest && window.XMLHttpRequest.prototype.open;
  if (ox) window.XMLHttpRequest.prototype.open = function(m,u){
    if (BLOCK.test(String(u))) { console.info('[demo] blocked XHR:', u); u = 'data:application/json,{}'; }
    return ox.apply(this, [m,u].concat([].slice.call(arguments,2)));
  };
  document.addEventListener('DOMContentLoaded', function(){
    if (sessionStorage.getItem('pjmDemoBannerHidden')) return;
    var b = document.createElement('div');
    b.id = 'pjmDemoBanner';
    b.innerHTML = 'DEMO BUILD \u2014 every person, project, ticket and meeting below is fictional. ' +
                  'Live integrations are disabled in this build.' +
                  '<button title="Dismiss" onclick="this.parentNode.remove();' +
                  'document.body.classList.remove(\'has-demo-banner\');' +
                  'sessionStorage.setItem(\'pjmDemoBannerHidden\',\'1\')">&times;</button>';
    document.body.appendChild(b);
    document.body.classList.add('has-demo-banner');
  });
})();
</script>

   and Overview can read today's real meetings without visiting this tab ── */

  var todayEvs = (PJM_CAL_STATIC.byDate && PJM_CAL_STATIC.byDate[today]) || [];

    }));

/* ═══════════════════════════════════════
   UTILITIES
═══════════════════════════════════════ */
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtTime(iso) {
  try {
    return new Date(iso).toLocaleTimeString('en-IN',{
      hour:'2-digit', minute:'2-digit', timeZone:'Asia/Kolkata', hour12:false
    });
  } catch(e) { return ''; }
}
function fmtDateShort(iso) {
  try {
    var d = new Date(iso);
    return DAY_NAMES[d.getDay()] + ' ' + d.getDate() + ' ' + MONTH_NAMES[d.getMonth()];
  } catch(e) { return ''; }
}
function fmtDur(startIso, endIso) {
  var m = Math.round((new Date(endIso) - new Date(startIso)) / 60000);
  if (m <= 0) return '';
  return m >= 60 ? Math.floor(m/60)+'h'+(m%60?' '+m%60+'m':'') : m+'min';
}
function fmtSize(bytes) {
  var n = parseInt(bytes||0);
  if (n > 1e9) return (n/1e9).toFixed(1)+' GB';
  if (n > 1e6) return (n/1e6).toFixed(0)+' MB';
  return Math.round(n/1000)+' KB';
}
function getEvtStart(ev) { return (ev.start&&ev.start.dateTime)||ev.start||ev.startTime||''; }
function getEvtEnd(ev)   { return (ev.end&&ev.end.dateTime)||ev.end||ev.endTime||''; }
function getEvtDate(ev)  { return getEvtStart(ev).substring(0,10); }

function detectProjects(title) {
  var t=(title||'').toLowerCase(), out=[];
  if(/\bdsp\b/.test(t))                     out.push('BEACON');
  if(/\b(cex|dex|exchange)\b/.test(t))      out.push('CEX');
  if(/\blabs?\b/.test(t))                   out.push('LABS');
  if(/\bmmp\b/.test(t))                     out.push('EMBER');
  if(/\bamp\b|agentic|marketplace/.test(t)) out.push('ATLAS');
  if(/\bbeacon\b/.test(t))                    out.push('BEACON');
  if(/adtech|ad tech/.test(t))              out.push('ADTECH');
  return out;
}

/* Title normalise + score (same logic as Meeting Hub artifact) */
function normStr(s) {
  return (s||'').toLowerCase()
    .replace(/^\[(del|ember|amp|adtech|beacon|cex|dex|labs|del\s*-)\]\s*/gi,'')
    .replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
function scoreTitle(a, b) {
  var na = normStr(a), nb = normStr(b);
  if (!na||!nb) return 0;
  if (na===nb) return 100;
  if (na.includes(nb)||nb.includes(na)) return 85;
  var wa=na.split(' ').filter(function(w){return w.length>3;});
  var wb=nb.split(' ').filter(function(w){return w.length>3;});
  if (!wa.length||!wb.length) return 0;
  var common=wa.filter(function(w){return wb.indexOf(w)>=0;}).length;
  return (common/Math.max(wa.length,wb.length))*60;
}
function parseRecTitle(title) {
  var m=(title||'').match(/^(.+?)\s*[-–]\s*\d{4}[\/\-]\d{2}[\/\-]\d{2}/);
  return m ? m[1].trim() : (title||'');
}
// Same stripping logic for Gemini notes (title ends "– YYYY/MM/DD HH:MM IST – Notes by Gemini")
function parseNoteTitle(title) {
  var m=(title||'').match(/^(.+?)\s*[-–]\s*\d{4}[\/\-]\d{2}[\/\-]\d{2}/);
  return m ? m[1].trim() : (title||'');
}
function parseRecDate(title) {
  var m=(title||'').match(/(\d{4})[\/\-](\d{2})[\/\-](\d{2})/);
  return m ? m[1]+'-'+m[2]+'-'+m[3] : '';
}

/* ─────────────────────────────────────
   Match Drive items to a calendar event
   (date-exact: same day + title score)
───────────────────────────────────────*/
var MIN_SCORE = 25;

function matchDriveToEvent(evSummary, evDate, driveFiles, isRec) {
  if (!driveFiles || !driveFiles.length) return [];
  // Filter by date: use explicit date field first (new Gmail-sourced notes), then title extract, then modifiedTime
  var dayFiles = driveFiles.filter(function(f){
    if (f.date) return f.date === evDate;
    var titleDate = parseRecDate(f.title||f.name||'');
    if (titleDate) return titleDate === evDate;
    var mt = (f.modifiedTime || f.createdTime || '').substring(0,10);
    return mt === evDate;
  });
  if (!dayFiles.length) return [];
  var scored = dayFiles.map(function(f){
    // For notes: if explicit date field exists, title is already clean; otherwise strip suffix
    var ft = isRec ? parseRecTitle(f.title||f.name||'') : (f.date ? (f.title||f.name||'') : parseNoteTitle(f.title||f.name||''));
    return { file: f, score: scoreTitle(evSummary, ft) };
  }).filter(function(x){ return x.score >= MIN_SCORE; })
    .sort(function(a,b){ return b.score-a.score; });
  // Fallback: single file on same day — only use for notes (not recordings),
  // and only when the title has at least partial overlap (score > 0)
  if (!scored.length && !isRec && dayFiles.length === 1) {
    var fb = { file: dayFiles[0], score: scoreTitle(evSummary, parseNoteTitle(dayFiles[0].title||dayFiles[0].name||'')) };
    if (fb.score > 0) scored = [fb];
  }
  return scored.map(function(x){ return x.file; });
}

function switchModTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.mod-tab').forEach(function(b){
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  render();
}

/* ═══════════════════════════════════════
   WEEK NAVIGATION
═══════════════════════════════════════ */
function getWeekDays() {
  var d = getISTNow(), dow = d.getDay();
  var monday = new Date(d);
  monday.setDate(d.getDate() - (dow===0 ? 6 : dow-1));
  monday.setHours(0,0,0,0);
  var days = [];
  for (var i=0;i<7;i++) { var dd=new Date(monday); dd.setDate(monday.getDate()+i); days.push(dd); }
  return days;
}

function switchDay(ds) { activeDay=ds; selEventId=null; render(); }
function selectEvent(id) {
  selEventId = (selEventId===id) ? null : id;
  render();
}

/* ═══════════════════════════════════════
   CALENDAR TAB RENDERING
═══════════════════════════════════════ */
function getEventsForDate(dateStr) {
  var cal = getCal();
  if (cal && cal.byDate && cal.byDate[dateStr]) return cal.byDate[dateStr];
  return [];
}

function renderCalTab() {
  var cal  = getCal();
  var isLive = !!(cal && cal.ts);
  var now  = new Date();
  var today = isoDate(getISTNow());

  // ── Next meeting strip
  var todayEvs = getEventsForDate(today);
  var todayCnt = isLive ? (cal.todayCount||todayEvs.length) : todayEvs.length;
  var upcoming = todayEvs.filter(function(e){
    return new Date(getEvtStart(e)) > now;
  }).sort(function(a,b){ return new Date(getEvtStart(a))-new Date(getEvtStart(b)); });

  var stripHtml;
  if (upcoming.length) {
    var nxt = upcoming[0];
    var minsLeft = Math.max(0, Math.round((new Date(getEvtStart(nxt))-now)/60000));
    var hrs=Math.floor(minsLeft/60), mins=minsLeft%60;
    var cntLabel = hrs>0 ? hrs+'h '+mins+'m away' : mins+'m away';
    stripHtml = '<div class="next-strip">'
      +'<div class="ns-left"><div class="ns-label">Next Meeting</div>'
      +'<div class="ns-title">'+esc(nxt.summary||nxt.title)+'</div>'
      +'<div class="ns-time">'+fmtTime(getEvtStart(nxt))+' IST · '+(nxt.attendees||[]).length+' people</div></div>'
      +'<span class="cntdown">⏰ '+cntLabel+'</span>'
      +'<div class="tdy-cnt">'+(isLive?'<span class="live-dot"></span>':'')+todayCnt+' meetings today</div>'
      +'</div>';
  } else {
    stripHtml = '<div class="next-strip">'
      +'<div class="ns-left"><div class="ns-label">Next Meeting</div>'
      +'<div class="ns-title">No more meetings today</div></div>'
      +'<div class="tdy-cnt" style="margin-left:auto">'+(isLive?'<span class="live-dot"></span>':'')+todayCnt+' today</div>'
      +'</div>';
  }

  // ── Week pills
  var evByDay = {};
  if (cal && cal.byDate) {
    Object.keys(cal.byDate).forEach(function(d){ evByDay[d] = cal.byDate[d]; });
  }
  var pillsHtml = '<div class="week-pills">'
    + getWeekDays().map(function(d){
        var ds = isoDate(d), cnt = (evByDay[ds]||[]).length;
        return '<button class="day-pill'+(ds===today?' today':'')+(ds===activeDay?' active':'')+'" onclick="switchDay(\''+ds+'\')">'
          +DAY_NAMES[d.getDay()]+'<span class="dp-num">'+d.getDate()+'</span>'
          +(cnt?'<span class="dp-dot"></span>':'')+'</button>';
      }).join('')
    +'</div>';

  // ── Meeting cards
  var dayEvs = getEventsForDate(activeDay).slice()
    .sort(function(a,b){ return new Date(getEvtStart(a))-new Date(getEvtStart(b)); });

  var cardsHtml;
  if (!dayEvs.length) {
    cardsHtml = '<div class="empty-day"><div style="font-size:36px">📭</div>'
      +'<div style="font-weight:700;color:#374151">No meetings on this day</div>'
      +(isLive ? '' : '<div class="pump-nudge">Run the Data Pump to load your live Google Calendar events.</div>')
      +'</div>';
  } else {
    var driveNotes = getDriveNotes();
    var driveRecs  = getDriveRecs();
    var dnFiles = driveNotes && driveNotes.files ? driveNotes.files : [];
    var drFiles = driveRecs  && driveRecs.files  ? driveRecs.files  : [];

    cardsHtml = dayEvs.map(function(ev){
      var evId     = ev.id || ev.uid || ev.summary;
      var isPast   = new Date(getEvtEnd(ev)||getEvtStart(ev)).getTime() < now.getTime();
      var isSel    = selEventId === evId;
      var projs    = detectProjects(ev.summary||ev.title||'');
      var evDate   = getEvtDate(ev);
      var matchedNotes = matchDriveToEvent(ev.summary||ev.title, evDate, dnFiles, false);
      var matchedRecs  = matchDriveToEvent(ev.summary||ev.title, evDate, drFiles, true);
      var dur = getEvtEnd(ev) ? fmtDur(getEvtStart(ev), getEvtEnd(ev)) : '';
      var cUrl = ev.conferenceUrl || ev.hangoutLink || '';

      return '<div class="mc'+(isPast?' mc-past':'')+(isSel?' mc-sel':'')+'" onclick="selectEvent(\''+esc(evId)+'\')">'
        +'<div class="mc-time-col"><div class="mc-time">'+fmtTime(getEvtStart(ev))+'</div>'
        +(dur?'<div class="mc-dur">'+dur+'</div>':'')+'</div>'
        +'<div class="mc-body">'
        +'<div class="mc-title">'+esc(ev.summary||ev.title)+'</div>'
        +'<div class="mc-chips">'
        +projs.map(function(p){return '<span class="chip chip-proj">'+p+'</span>';}).join('')
        +(matchedNotes.length?'<span class="chip chip-note">📄 Notes</span>':'')
        +(matchedRecs.length?'<span class="chip chip-rec">🎬 Rec</span>':'')
        +'<span class="chip chip-att">👥 '+(ev.attendees||[]).length+'</span>'
        +'</div></div>'
        +(cUrl?'<a class="mc-join" href="'+esc(cUrl)+'" target="_blank" onclick="event.stopPropagation()">🎥 Join</a>':'')
        +'</div>';
    }).join('');
  }

  // ── Drawer
  var drawerHtml = selEventId
    ? '<div class="cal-aside" id="drawerAside">'+buildDrawer(dayEvs)+'</div>'
    : '<div class="cal-aside" id="drawerAside"></div>';

  // Banner when data is stale (over 8 hours old)
  var ageHrs = isLive ? Math.round((Date.now() - getCal().ts) / 3600000) : 0;
  var noBanner = (!isLive || ageHrs > 8)
    ? '<div class="no-data-banner">'
      +'<div class="ndb-icon">🔄</div>'
      +'<div class="ndb-body">'
      +'<div class="ndb-title">'+(isLive ? 'Data is '+ageHrs+'h old — sync to refresh' : 'No calendar data embedded')+'</div>'
      +'<div class="ndb-text">To refresh: say <strong>"Sync my meetings for this week"</strong> to Claude in Cowork. Claude will fetch from your Google Calendar & Drive and update this file instantly.</div>'
      +'</div></div>'
    : '';

  return noBanner + stripHtml + pillsHtml
    + '<div class="cal-layout"><div class="cal-main">'+cardsHtml+'</div>'+drawerHtml+'</div>';
}

function buildDrawer(dayEvs) {
  var selEv = null;
  for (var i=0;i<dayEvs.length;i++){
    var eid = dayEvs[i].id||dayEvs[i].uid||dayEvs[i].summary;
    if (eid === selEventId) { selEv = dayEvs[i]; break; }
  }
  if (!selEv) return '';

  var evDate = getEvtDate(selEv);
  var driveNotes = getDriveNotes();
  var driveRecs  = getDriveRecs();
  var dnFiles = driveNotes && driveNotes.files ? driveNotes.files : [];
  var drFiles = driveRecs  && driveRecs.files  ? driveRecs.files  : [];

  var matchedNotes = matchDriveToEvent(selEv.summary||selEv.title, evDate, dnFiles, false);
  var matchedRecs  = matchDriveToEvent(selEv.summary||selEv.title, evDate, drFiles, true);
  var attendees = selEv.attendees || [];
  var cUrl = selEv.conferenceUrl || selEv.hangoutLink || '';
  var desc = (selEv.description||'').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&[a-z]+;/gi,' ').trim();

  var evId = selEv.id||selEv.uid||selEv.summary;

  // Notes HTML
  var notesHtml = matchedNotes.length
    ? matchedNotes.map(function(f){
        var url = f.viewUrl||'https://docs.google.com/document/d/'+f.id+'/edit';
        return '<div class="asset-card note-c">'
          +'<div class="ac-icon">📄</div>'
          +'<div class="ac-info"><div class="ac-title">'+esc(f.title||f.name)+'</div>'
          +'<div class="ac-sub">Updated '+fmtDateShort(f.date ? f.date+'T12:00:00' : f.modifiedTime)+'</div></div>'
          +'<a class="ac-open" href="'+esc(url)+'" target="_blank">Open →</a>'
          +'</div>';
      }).join('')
    : '<div class="no-asset">No Gemini notes found for this meeting yet. Enable "Take notes for me" in Google Meet to generate them automatically.</div>';

  // Recordings HTML
  var recsHtml = matchedRecs.length
    ? matchedRecs.map(function(f){
        var url = f.viewUrl||'https://drive.google.com/file/d/'+f.id+'/view';
        var mt  = parseRecTitle(f.title||f.name||'');
        return '<div class="asset-card rec-c">'
          +'<div class="ac-icon">🎬</div>'
          +'<div class="ac-info"><div class="ac-title">'+esc(mt)+'</div>'
          +'<div class="ac-sub">'+fmtDateShort(parseRecDate(f.title||f.name||'')||f.modifiedTime)+'</div></div>'
          +'<a class="ac-open" href="'+esc(url)+'" target="_blank">Open →</a>'
          +'</div>';
      }).join('')
    : '<div class="no-asset">No recording found for this meeting.</div>';

  return '<div class="detail-drawer">'
    +'<div class="dd-head">'
    +'<div class="dd-head-title">'+esc(selEv.summary||selEv.title)+'</div>'
    +'<div class="dd-head-meta">'
    +fmtTime(getEvtStart(selEv))
    +(getEvtEnd(selEv)?' – '+fmtTime(getEvtEnd(selEv)):'')
    +' IST'+(getEvtEnd(selEv)?' · '+fmtDur(getEvtStart(selEv),getEvtEnd(selEv)):'')
    +'</div>'
    +'<button class="dd-close" onclick="selectEvent(\''+esc(evId)+'\')">✕</button>'
    +'</div>'
    +'<div class="dd-body">'
    +(cUrl?'<a class="al-green" href="'+esc(cUrl)+'" target="_blank">🎥 Join on Google Meet →</a>':'')
    +'<div class="sec-lbl">Attendees ('+attendees.length+')</div>'
    +'<div class="att-row">'+attendees.map(function(a){
        var name = a.displayName||(a.email||a).split('@')[0];
        return '<span class="att-chip">'+esc(name)+'</span>';
      }).join('')+'</div>'
    +(desc?'<div class="sec-lbl">Agenda</div><div class="desc-box">'+esc(desc)+'</div>':'')
    +'<div class="sec-lbl">📝 Gemini Notes</div>'+notesHtml
    +'<div class="sec-lbl">🎬 Recording</div>'+recsHtml
    +'</div></div>';
}

/* ═══════════════════════════════════════
   NOTES TAB RENDERING
═══════════════════════════════════════ */
function renderNotesTab() {
  var dn = getDriveNotes();
  var tip = '<div class="grid-tip">'
    +'📬 <strong>Sourced from Gmail</strong> — notes arrive from <code>meeting-notes@example.com</code> within minutes of each meeting ending. '
    +'Each tile shows the Gemini-generated summary. Click <strong>Open Notes</strong> to read the full doc with action items. '
    +'Say <strong>"Sync my meetings"</strong> to Claude to refresh this list.'
    +'</div>';

  if (!dn || !dn.files || !dn.files.length) {
    return tip + '<div class="empty-day"><div style="font-size:36px">📝</div>'
      +'<div style="font-weight:700;color:#374151">No meeting docs yet</div>'
      +'<div class="pump-nudge">Run the Data Pump to fetch Gemini-generated notes from your Google Drive.</div>'
      +'</div>';
  }
  // Sort newest first
  var sorted = dn.files.slice().sort(function(a,b){
    return (b.date||'').localeCompare(a.date||'');
  });
  return tip + '<div class="notes-grid">' + sorted.map(function(f){
    var url = f.viewUrl||'https://docs.google.com/document/d/'+f.id+'/edit';
    // Support both new format (clean title + date field) and old format (long title with date suffix)
    var cleanTitle = f.date ? (f.title||f.name||'') : parseNoteTitle(f.title||f.name||'');
    var meetingDate = f.date || parseRecDate(f.title||f.name||'');
    var dateLabel = meetingDate ? fmtDateShort(meetingDate+'T12:00:00') : fmtDateShort(f.createdTime||f.modifiedTime||'');
    var summaryHtml = f.summary ? '<div class="tile-summary">'+esc(f.summary)+'</div>' : '';
    return '<div class="note-tile">'
      +'<div class="tile-icon">📄</div>'
      +'<div class="tile-title">'+esc(cleanTitle)+'</div>'
      +'<div class="tile-date">📅 '+esc(dateLabel)+'</div>'
      +summaryHtml
      +'<a class="note-btn" href="'+esc(url)+'" target="_blank">📝 Open Notes</a>'
      +'</div>';
  }).join('') + '</div>';
}

/* ═══════════════════════════════════════
   RECORDINGS TAB RENDERING
═══════════════════════════════════════ */
function renderRecsTab() {
  var dr = getDriveRecs();
  if (!dr || !dr.files || !dr.files.length) {
    return '<div class="empty-day"><div style="font-size:36px">🎥</div>'
      +'<div style="font-weight:700;color:#374151">No recordings yet</div>'
      +'<div class="pump-nudge">Run the Data Pump to fetch Google Meet recordings from your Google Drive.</div>'
      +'</div>';
  }
  return '<div class="rec-grid">' + dr.files.map(function(r){
    var url = r.viewUrl||'https://drive.google.com/file/d/'+r.id+'/view';
    var mt  = parseRecTitle(r.title||r.name||'');
    var rd  = parseRecDate(r.title||r.name||'');
    return '<div class="rec-tile">'
      +'<div class="tile-icon">🎬</div>'
      +'<div class="tile-title">'+esc(mt)+'</div>'
      +'<div class="tile-date">📅 '+esc(fmtDateShort(rd?rd+'T12:00:00':r.modifiedTime))+'</div>'
      +(r.fileSize?'<div class="tile-size">'+fmtSize(r.fileSize)+'</div>':'')
      +'<a class="rec-btn" href="'+esc(url)+'" target="_blank">▶ Open Recording</a>'
      +'</div>';
  }).join('') + '</div>';
}

/* ═══════════════════════════════════════
   MASTER RENDER
═══════════════════════════════════════ */
function updateTabCounts() {
  var cal = getCal();
  var dn  = getDriveNotes();
  var dr  = getDriveRecs();
  var today = isoDate(getISTNow());
  var todayCnt = 0;
  if (cal && cal.byDate && cal.byDate[today]) todayCnt = cal.byDate[today].length;
  else if (cal && cal.todayCount) todayCnt = cal.todayCount;
  var notesCnt = dn && dn.files ? dn.files.length : 0;
  var recsCnt  = dr && dr.files ? dr.files.length : 0;
  document.getElementById('tcCal').textContent   = todayCnt || '—';
  document.getElementById('tcNotes').textContent = notesCnt || '—';
  document.getElementById('tcRecs').textContent  = recsCnt  || '—';
}

function render() {
  updateTabCounts();
  var html = '';
  if      (activeTab === 'calendar')   html = renderCalTab();
  else if (activeTab === 'notes')      html = renderNotesTab();
  else if (activeTab === 'recordings') html = renderRecsTab();
  document.getElementById('moduleContent').innerHTML = html;
}

/* ═══════════════════════════════════════
   SYNC
═══════════════════════════════════════ */
function showToast(msg) {
  var t = document.getElementById('toastEl');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 4000);
}

function doSync() {
  /* Data is embedded statically — Claude does the sync via MCP and rewrites the file.
     Show a prompt toast just like the Dashboard does. */
  showToast('📅 Say "Sync my meetings for this week" to Claude — it will fetch from Google Calendar & Drive and update this file automatically');
  var cal = getCal(), dn = getDriveNotes(), dr = getDriveRecs();
  var today = isoDate(getISTNow());
  var todayCnt = (cal && cal.byDate && cal.byDate[today]) ? cal.byDate[today].length : (cal&&cal.todayCount||0);
  PJMSync.markSynced(MODULE_ID, { todayMeetings: todayCnt, notes: dn&&dn.files?dn.files.length:0, recordings: dr&&dr.files?dr.files.length:0 });
}

/* ═══════════════════════════════════════
   BOOT
═══════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', function(){
  PJMNav.render(MODULE_ID);
  PJMSync.initModule(MODULE_ID, doSync);
  render();
  /* Mark synced with counts from the embedded static data */
  var cal = getCal(), dn = getDriveNotes(), dr = getDriveRecs();
  var today = isoDate(getISTNow());
  var todayCnt = (cal && cal.byDate && cal.byDate[today]) ? cal.byDate[today].length : (cal&&cal.todayCount||0);
  PJMSync.markSynced(MODULE_ID, { todayMeetings: todayCnt, notes: dn&&dn.files?dn.files.length:0, recordings: dr&&dr.files?dr.files.length:0 });
});
</script>
