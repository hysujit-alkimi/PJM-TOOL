.mkpi .mv{font-size:22px;font-weight:800;line-height:1;}

.del-tbl{width:100%;border-collapse:collapse;font-size:13px;}
.del-tbl th{background:#f9fafb;padding:9px 14px;text-align:left;font-weight:600;font-size:11px;color:#6b7280;border-bottom:1px solid #e5e7eb;white-space:nowrap;}

<script id="pjmDemoMode">
/* ===== PUBLIC DEMO BUILD =====
   All data in this build is fictional. No credentials ship with it and no
   outbound calls to third-party APIs are permitted. */
(function(){
  window.PJM_DEMO = true;
  var BLOCK = /(api\.linear\.app|api\.github\.com|graphql|googleapis\.com|slack\.com|atlassian\.net)/i;
  var of = window.fetch;
  window.fetch = function(input){
    var u = (typeof input === 'string') ? input : (input && input.url) || '';
    if (BLOCK.test(u)) {
      console.info('[demo] blocked outbound call:', u);
      return Promise.resolve(new Response(JSON.stringify({data:null,demo:true}),
        {status:200, headers:{'Content-Type':'application/json'}}));
    }
    return of.apply(this, arguments);
  };
  var ox = window.XMLHttpRequest && window.XMLHttpRequest.prototype.open;
  if (ox) window.XMLHttpRequest.prototype.open = function(m,u){
    if (BLOCK.test(String(u))) { console.info('[demo] blocked XHR:', u); u = 'data:application/json,{}'; }
    return ox.apply(this, [m,u].concat([].slice.call(arguments,2)));
  };
  document.addEventListener('DOMContentLoaded', function(){
    if (sessionStorage.getItem('pjmDemoBannerHidden')) return;
    var b = document.createElement('div');
    b.id = 'pjmDemoBanner';
    b.innerHTML = 'DEMO BUILD \u2014 every person, project, ticket and meeting below is fictional. ' +
                  'Live integrations are disabled in this build.' +
                  '<button title="Dismiss" onclick="this.parentNode.remove();' +
                  'document.body.classList.remove(\'has-demo-banner\');' +
                  'sessionStorage.setItem(\'pjmDemoBannerHidden\',\'1\')">&times;</button>';
    document.body.appendChild(b);
    document.body.classList.add('has-demo-banner');
  });
})();
</script>

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function statusBadge(sc, label){ return badge(label||sc, statusMap[sc]||'b-todo'); }
function progressBar(pct, gradient){

function tabs(){

}

function switchTab(key){ activeTab=key; render(); }

function showToast(msg){

      +'<th>#</th><th>Feature</th><th>Product</th><th>Release Date</th><th>Status</th>'
      +'</tr></thead><tbody>';

    items.forEach(function(item){

  }, 600);
}

document.addEventListener('DOMContentLoaded', function(){
  PJMNav.render(MODULE_ID);
  PJMSync.initModule(MODULE_ID, doSync);
  var d=new Date();
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var el=document.getElementById('todayDate');
  if(el) el.textContent='📅 '+days[d.getDay()]+' '+months[d.getMonth()]+' '+d.getDate();
  render();
});
</script>
</body>
</html>
