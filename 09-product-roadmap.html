.sub-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}

.roadmap-table th{background:#f9fafb;padding:9px 12px;text-align:left;font-weight:600;font-size:12px;color:var(--muted,#6b7280);border-bottom:1px solid var(--border,#e5e7eb);white-space:nowrap;}
.roadmap-table th.q-header{text-align:center;min-width:90px;}

<script id="pjmDemoMode">
/* ===== PUBLIC DEMO BUILD =====
   All data in this build is fictional. No credentials ship with it and no
   outbound calls to third-party APIs are permitted. */
(function(){
  window.PJM_DEMO = true;
  var BLOCK = /(api\.linear\.app|api\.github\.com|graphql|googleapis\.com|slack\.com|atlassian\.net)/i;
  var of = window.fetch;
  window.fetch = function(input){
    var u = (typeof input === 'string') ? input : (input && input.url) || '';
    if (BLOCK.test(u)) {
      console.info('[demo] blocked outbound call:', u);
      return Promise.resolve(new Response(JSON.stringify({data:null,demo:true}),
        {status:200, headers:{'Content-Type':'application/json'}}));
    }
    return of.apply(this, arguments);
  };
  var ox = window.XMLHttpRequest && window.XMLHttpRequest.prototype.open;
  if (ox) window.XMLHttpRequest.prototype.open = function(m,u){
    if (BLOCK.test(String(u))) { console.info('[demo] blocked XHR:', u); u = 'data:application/json,{}'; }
    return ox.apply(this, [m,u].concat([].slice.call(arguments,2)));
  };
  document.addEventListener('DOMContentLoaded', function(){
    if (sessionStorage.getItem('pjmDemoBannerHidden')) return;
    var b = document.createElement('div');
    b.id = 'pjmDemoBanner';
    b.innerHTML = 'DEMO BUILD \u2014 every person, project, ticket and meeting below is fictional. ' +
                  'Live integrations are disabled in this build.' +
                  '<button title="Dismiss" onclick="this.parentNode.remove();' +
                  'document.body.classList.remove(\'has-demo-banner\');' +
                  'sessionStorage.setItem(\'pjmDemoBannerHidden\',\'1\')">&times;</button>';
    document.body.appendChild(b);
    document.body.classList.add('has-demo-banner');
  });
})();
</script>

/* ════════════════════════════════════════
   INDEXEDDB — persist file handle
════════════════════════════════════════ */
var IDB_NAME='PJMTool', IDB_STORE='handles', IDB_KEY='roadmapJSON';
function idbOpen(){
  return new Promise(function(resolve,reject){
    var req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=function(e){e.target.result.createObjectStore(IDB_STORE);};
    req.onsuccess=function(e){resolve(e.target.result);};
    req.onerror=function(e){reject(e.target.error);};
  });
}
async function idbPutHandle(h){try{var db=await idbOpen();return new Promise(function(res,rej){var tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(h,IDB_KEY);tx.oncomplete=res;tx.onerror=function(e){rej(e.target.error);};});}catch(e){console.warn(e);}}
async function idbGetHandle(){try{var db=await idbOpen();return new Promise(function(res,rej){var tx=db.transaction(IDB_STORE,'readonly');var r=tx.objectStore(IDB_STORE).get(IDB_KEY);r.onsuccess=function(e){res(e.target.result||null);};r.onerror=function(e){rej(e.target.error);};});}catch(e){return null;}}

/* ════════════════════════════════════════
   JSON PERSISTENCE
════════════════════════════════════════ */
async function loadFromHandle(handle){
  var file=await handle.getFile();
  var text=await file.text();
  var data=JSON.parse(text);
  roadmap=data.roadmap||roadmap;
  nextId=data.nextId||nextId;
  jsonFileHandle=handle;
  setBannerConnected(file.name);
  render();
}

async function connectJSON(){
  try{
    var handles=await window.showOpenFilePicker({types:[{description:'JSON',accept:{'application/json':['.json']}}],multiple:false});
    var handle=handles[0];
    await loadFromHandle(handle);
    await idbPutHandle(handle);
    setSaveIndicator('saved','Loaded from '+handle.name);
  }catch(e){if(e.name!=='AbortError'){setSaveIndicator('error','Could not open file');}}
}

async function tryAutoConnect(){
  var handle=await idbGetHandle();
  if(!handle)return;
  try{
    var perm=await handle.queryPermission({mode:'readwrite'});
    if(perm==='granted'){await loadFromHandle(handle);setSaveIndicator('saved','✓ Auto-reconnected');}
    else if(perm==='prompt'){showReconnectBanner(handle);}
  }catch(e){console.warn(e);}
}

function showReconnectBanner(handle){
  var banner=document.getElementById('rmJsonBanner');
  document.getElementById('rmBannerMsg').innerHTML='🔑 <strong>'+handle.name+'</strong> was connected last time. Click to restore.';
  var btn=banner.querySelector('button');btn.textContent='Reconnect';
  btn.onclick=async function(){try{var p=await handle.requestPermission({mode:'readwrite'});if(p==='granted'){await loadFromHandle(handle);await idbPutHandle(handle);setSaveIndicator('saved','Reconnected');}}catch(e){console.error(e);}};
}

async function saveToJSON(){
  if(!jsonFileHandle)return;
  setSaveIndicator('saving','Saving…');
  try{
    var writable=await jsonFileHandle.createWritable();
    await writable.write(JSON.stringify({nextId:nextId,roadmap:roadmap},null,2));
    await writable.close();
    setSaveIndicator('saved','✓ Saved');
    PJMSync.markSynced(MODULE_ID,{});
  }catch(e){setSaveIndicator('error','Save failed');console.error(e);}
}

function setBannerConnected(filename){
  var banner=document.getElementById('rmJsonBanner');
  banner.classList.add('connected');
  document.getElementById('rmBannerMsg').innerHTML='✅ Connected to <strong>'+filename+'</strong> — changes save automatically.';
  banner.querySelector('button').style.display='none';
}

function setSaveIndicator(state,msg){
  var el=document.getElementById('rmSaveIndicator');
  el.className=state;el.textContent=msg;
  if(state==='saved')setTimeout(function(){el.textContent='';el.className='';},3000);
}

════════════════════════════════════════ */
function statusClass(s){
  var m={'IN PROGRESS':'in-progress','SYSTEM TESTING':'system-testing','DEV COMPLETED':'dev-completed','DONE':'done','COMPLETED':'completed','TO DO':'to-do','BLOCKED':'blocked','PLANNING':'planning','PLANNED':'planned'};
  return m[s]||'planned';
}

function qPill(active,qLabel,qKey,status){
  if(!active)return '<span style="color:#e5e7eb;font-size:16px;">—</span>';
  var isDone=(status==='DEV COMPLETED'||status==='DONE'||status==='COMPLETED');
  return '<span class="q-pill '+qKey+(isDone?' done':'')+'">'+qLabel+'</span>';
}

function renderTabs(){
  return '<div class="sub-tabs">'+tabDefs.map(function(t){
    return '<button class="sub-tab'+(t.key===activeTab?' active':'')+'" onclick="switchTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join('')+'</div>';
}

function switchTab(key){activeTab=key;render();}

function renderLegend(){
  return '<div class="legend">'
    +'<span style="font-weight:600;color:var(--muted);">Legend:</span>'
    +'<div class="legend-item"><span class="q-pill q1" style="padding:2px 10px;">■</span><span>Q1</span></div>'
    +'<div class="legend-item"><span class="q-pill q2" style="padding:2px 10px;">■</span><span>Q2 (Active)</span></div>'
    +'<div class="legend-item"><span class="q-pill q3" style="padding:2px 10px;">■</span><span>Q3 (Upcoming)</span></div>'
    +'<div class="legend-item"><span class="q-pill q4" style="padding:2px 10px;">■</span><span>Q4 (Future)</span></div>'
    +'<div class="legend-item"><span class="q-pill q2 done" style="padding:2px 10px;">■</span><span>Completed</span></div>'
    +'</div>';
}

function renderTable(items){
  if(!items||!items.length)return '<p style="color:var(--muted);font-size:13px;padding:20px;">No items. Click "Add Initiative" to get started.</p>';
  var sorted=sortItems(items);
  var rows=sorted.map(function(d,idx){
    return '<tr>'
      +'<td class="no-cell">'+(idx+1)+'</td>'
      +'<td style="font-weight:600;max-width:260px;">'+esc(d.initiative)+'</td>'
      +'<td class="q-cell">'+qPill(d.q1,'Q1 2026','q1',d.status)+'</td>'
      +'<td class="q-cell">'+qPill(d.q2,'Q2 2026','q2',d.status)+'</td>'
      +'<td class="q-cell">'+qPill(d.q3,'Q3 2026','q3',d.status)+'</td>'
      +'<td class="q-cell">'+qPill(d.q4,'Q4 2026','q4',d.status)+'</td>'
      +'<td><span class="status-badge '+statusClass(d.status)+'">'+d.status+'</span></td>'
      +'<td style="font-size:12px;color:var(--muted);">'+esc(d.owner||'')+'</td>'
      +'<td style="white-space:nowrap;">'
        +'<button class="row-edit" onclick="editItem('+d.id+',\''+activeTab+'\')">✎</button>'
        +'<button class="row-del" onclick="deleteItem('+d.id+',\''+activeTab+'\')">✕</button>'
      +'</td>'
      +'</tr>';
  }).join('');
  return '<div style="overflow-x:auto;"><table class="roadmap-table"><thead><tr>'
    +'<th class="no-col">#</th>'
    +'<th>Initiative</th>'
    +'<th class="q-header">Q1 2026</th>'
    +'<th class="q-header">Q2 2026</th>'
    +'<th class="q-header">Q3 2026</th>'
    +'<th class="q-header">Q4 2026</th>'
    +'<th>Status</th><th>Owner</th><th>Actions</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function esc(str){return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ── Sort helpers: earliest quarter → status priority ── */
function earliestQuarter(item){
  if(item.q1)return 1;
  if(item.q2)return 2;
  if(item.q3)return 3;
  if(item.q4)return 4;
  return 5;
}
function statusOrder(s){
  var o={'COMPLETED':1,'DEV COMPLETED':2,'IN PROGRESS':3,'SYSTEM TESTING':4,'TO DO':5,'PLANNING':6,'PLANNED':7,'BLOCKED':8};
  return o[s]||9;
}
function sortItems(items){
  return items.slice().sort(function(a,b){
    var qDiff=earliestQuarter(a)-earliestQuarter(b);
    if(qDiff!==0)return qDiff;
    return statusOrder(a.status)-statusOrder(b.status);
  });
}

function showToast(msg){
  var t=document.getElementById('toastEl');if(!t)return;
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},3500);
}

/* ════════════════════════════════════════
   MAIN RENDER
════════════════════════════════════════ */
function render(){
  var items=roadmap[activeTab]||[];
  var html='';

  /* JSON banner */
  html+='<div id="rmJsonBanner">'
    +'<span class="banner-icon">📂</span>'
    +'<span class="banner-msg" id="rmBannerMsg">Connect <strong>roadmap-data.json</strong> to enable auto-save. Changes will persist every time you open this page.</span>'
    +'<button class="rm-btn rm-btn-primary" onclick="connectJSON()">Connect JSON</button>'
    +'</div>';

  /* re-apply connected state if handle exists */
  if(jsonFileHandle){
    setTimeout(function(){
      var b=document.getElementById('rmJsonBanner');
      if(b&&!b.classList.contains('connected')){
        b.classList.add('connected');
        var msg=document.getElementById('rmBannerMsg');
        if(msg)msg.innerHTML='✅ Connected — changes save automatically.';
        var btn=b.querySelector('button');if(btn)btn.style.display='none';
      }
    },0);
  }

  html+=renderTabs();
  html+='<div class="rm-controls">'
    +'<button class="rm-btn rm-btn-primary" onclick="openAddModal()">➕ Add Initiative</button>'
    +'</div>';
  html+=renderLegend();
  html+=renderTable(items);

  document.getElementById('moduleContent').innerHTML=html;
}

/* ════════════════════════════════════════
   ADD / EDIT / DELETE
════════════════════════════════════════ */
function openAddModal(){
  editingId=null;
  document.getElementById('rmModalTitle').textContent='Add Initiative';
  document.getElementById('rmSubmitBtn').textContent='Add Initiative';
  document.getElementById('rmForm').reset();
  document.getElementById('rmTab').value=activeTab;
  document.getElementById('rmModal').classList.add('active');
}

function editItem(id,tabKey){
  var list=roadmap[tabKey]||[];
  var item=list.find(function(x){return x.id===id;});
  if(!item)return;
  editingId={id:id,tab:tabKey};
  document.getElementById('rmModalTitle').textContent='Edit Initiative';
  document.getElementById('rmSubmitBtn').textContent='Update Initiative';
  document.getElementById('rmTab').value=tabKey;
  document.getElementById('rmInitiative').value=item.initiative||'';
  document.getElementById('rmQ1').checked=!!item.q1;
  document.getElementById('rmQ2').checked=!!item.q2;
  document.getElementById('rmQ3').checked=!!item.q3;
  document.getElementById('rmQ4').checked=!!item.q4;
  document.getElementById('rmStatus').value=item.status||'TO DO';
  document.getElementById('rmOwner').value=item.owner||'';
  document.getElementById('rmModal').classList.add('active');
}

function deleteItem(id,tabKey){
  if(!confirm('Delete this initiative?'))return;
  roadmap[tabKey]=(roadmap[tabKey]||[]).filter(function(x){return x.id!==id;});
  saveToJSON();
  render();
  showToast('Initiative deleted.');
}

function closeRmModal(){
  document.getElementById('rmModal').classList.remove('active');
  document.getElementById('rmForm').reset();
  editingId=null;
}

document.getElementById('rmForm').addEventListener('submit',function(e){
  e.preventDefault();
  var tabKey=document.getElementById('rmTab').value;
  var data={
    initiative:document.getElementById('rmInitiative').value.trim(),
    q1:document.getElementById('rmQ1').checked,
    q2:document.getElementById('rmQ2').checked,
    q3:document.getElementById('rmQ3').checked,
    q4:document.getElementById('rmQ4').checked,
    status:document.getElementById('rmStatus').value,
    owner:document.getElementById('rmOwner').value.trim()
  };

  if(editingId){
    /* If tab changed, move item */
    var oldTab=editingId.tab;
    var id=editingId.id;
    if(oldTab!==tabKey){
      roadmap[oldTab]=(roadmap[oldTab]||[]).filter(function(x){return x.id!==id;});
      roadmap[tabKey]=roadmap[tabKey]||[];
      roadmap[tabKey].push(Object.assign({id:id},data));
    } else {
      var idx=(roadmap[tabKey]||[]).findIndex(function(x){return x.id===id;});
      if(idx!==-1)roadmap[tabKey][idx]=Object.assign({},roadmap[tabKey][idx],data);
    }
    activeTab=tabKey;
    showToast('Initiative updated.');
  } else {
    roadmap[tabKey]=roadmap[tabKey]||[];
    roadmap[tabKey].push(Object.assign({id:nextId++},data));
    activeTab=tabKey;
    showToast('Initiative added.');
  }

  saveToJSON();
  closeRmModal();
  render();
});

/* close on outside click */
document.getElementById('rmModal').addEventListener('click',function(e){if(e.target.id==='rmModal')closeRmModal();});

/* ════════════════════════════════════════
   SYNC
════════════════════════════════════════ */
function doSync(){
  PJMSync.markLoading(MODULE_ID);
  PJMSync.setSyncBtnState(true);
  if(jsonFileHandle){
    jsonFileHandle.getFile().then(function(file){return file.text();}).then(function(text){
      var data=JSON.parse(text);
      roadmap=data.roadmap||roadmap;
      nextId=data.nextId||nextId;
      render();
      PJMSync.markSynced(MODULE_ID,{});
      PJMSync.setSyncBtnState(false);
      setSaveIndicator('saved','✓ Refreshed from file');
    }).catch(function(){PJMSync.setSyncBtnState(false);setSaveIndicator('error','Refresh failed');});
  } else {
    setTimeout(function(){
      render();
      PJMSync.markSynced(MODULE_ID,{});
      PJMSync.setSyncBtnState(false);
      showToast('Live Confluence + Sheets integration coming — data reflects current planning');
    },700);
  }
}

/* ════════════════════════════════════════
   INIT
════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded',function(){
  PJMNav.render(MODULE_ID);
  PJMSync.initModule(MODULE_ID,doSync);
  render();              // always paint immediately with built-in data
  tryAutoConnect();      // silently reconnect JSON in background if previously connected
});
</script>
