<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Standup Brief — Meridian PJM</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="shared/pjm.css">
<style>
/* ── Sprint Hero ── */
.sprint-hero{background:linear-gradient(135deg,#eff6ff 0%,#f5f3ff 100%);border:1px solid #c7d2fe;border-radius:16px;padding:28px 32px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.sprint-hero-left{display:flex;flex-direction:column;gap:8px;}
.sprint-hero-date{font-size:22px;font-weight:800;color:#1f2937;}
.sprint-hero-badge{display:inline-flex;align-items:center;gap:8px;background:#fff;border:2px solid #6C63FF;border-radius:24px;padding:8px 20px;font-size:15px;font-weight:800;color:#6C63FF;width:fit-content;}
.sprint-hero-sub{font-size:13px;color:#6b7280;margin-top:2px;}
.sprint-progress-ring{display:flex;flex-direction:column;align-items:center;gap:6px;}
.sprint-day-pills{display:flex;gap:4px;flex-wrap:wrap;max-width:240px;}
.day-pill{width:18px;height:18px;border-radius:4px;background:#e5e7eb;}
.day-pill.done{background:linear-gradient(135deg,#3B82F6,#6C63FF);}
.day-pill.today{background:linear-gradient(135deg,#f59e0b,#fbbf24);box-shadow:0 0 0 2px #fff,0 0 0 3px #f59e0b;}
.sprint-day-label{font-size:11px;color:#6b7280;font-weight:600;}

/* ── Section cards ── */
.sb-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px 24px;margin-bottom:16px;}
.sb-card-title{font-size:14px;font-weight:800;color:#1f2937;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.live-badge{font-size:10px;color:#10b981;font-weight:800;background:#d1fae5;padding:1px 8px;border-radius:8px;}

/* ── Meetings + Notes combined ── */
.mtg-note-row{display:grid;grid-template-columns:36px 1.3fr 1.7fr 1fr 1fr;gap:0;border-bottom:1px solid #f3f4f6;transition:background .15s;}
.mtg-note-row:last-child{border-bottom:none;}
.mtg-note-row:hover{background:#fafafa;}
.mtg-note-row.row-selected{background:#f5f3ff;}
.mtg-chk-cell{display:flex;align-items:center;justify-content:center;padding:14px 0;}
.mtg-chk{width:16px;height:16px;cursor:pointer;accent-color:#6C63FF;}
.mtg-left{display:flex;gap:10px;align-items:center;padding:14px 16px 14px 4px;}
.mtg-right{padding:14px 0 14px 16px;border-left:1px solid #f3f4f6;}
.meeting-time{background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:700;padding:3px 10px;border-radius:8px;white-space:nowrap;min-width:84px;text-align:center;flex-shrink:0;}
.meeting-title{font-size:13px;font-weight:600;color:#1f2937;flex:1;}
.meeting-dur{font-size:11px;color:#9ca3af;white-space:nowrap;}
.join-btn{font-size:11px;font-weight:700;color:#3b82f6;text-decoration:none;flex-shrink:0;padding:2px 8px;border:1px solid #bfdbfe;border-radius:6px;transition:all .15s;}
.join-btn:hover{background:#eff6ff;}
/* Note panel */
.note-empty{font-size:12px;color:#d1d5db;font-style:italic;display:flex;align-items:center;height:100%;}
.note-panel{}
.note-source-row{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
.note-badge-title{font-size:11px;font-weight:700;color:#374151;}
.note-badge-date{font-size:10px;color:#9ca3af;background:#f3f4f6;padding:1px 6px;border-radius:5px;}
.note-badge-src{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;background:#dbeafe;color:#1d4ed8;}
.note-summary-text{font-size:12px;color:#374151;line-height:1.6;border-left:3px solid #6C63FF;padding:8px 12px;background:#fafafa;border-radius:0 6px 6px 0;}
.note-ais{margin-top:8px;display:flex;flex-direction:column;gap:4px;}
.note-ai-item{display:flex;gap:6px;align-items:flex-start;font-size:11px;color:#6b7280;}
.note-ai-dot{width:5px;height:5px;border-radius:50%;background:#6C63FF;flex-shrink:0;margin-top:4px;}

/* ── Generate button ── */
.generate-zone{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 100%);border-radius:16px;padding:28px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.generate-zone-text{}
.generate-zone-title{font-size:18px;font-weight:800;color:#fff;margin-bottom:6px;}
.generate-zone-sub{font-size:13px;color:#a5b4fc;line-height:1.5;}
.generate-btn{background:linear-gradient(135deg,#6C63FF,#3B82F6);color:#fff;border:none;border-radius:12px;padding:14px 32px;font-size:15px;font-weight:800;cursor:pointer;white-space:nowrap;transition:opacity .15s;box-shadow:0 4px 20px rgba(108,99,255,.4);}
.generate-btn:hover{opacity:.9;}
.generate-btn:active{opacity:.8;transform:scale(.98);}
.generate-btn:disabled{opacity:.5;cursor:not-allowed;}

/* ── Workflow steps ── */
.workflow-steps{display:flex;gap:6px;align-items:center;margin-top:12px;flex-wrap:wrap;}
.ws{display:flex;align-items:center;gap:5px;font-size:11px;color:#a5b4fc;}
.ws-num{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0;}
.ws-arrow{color:rgba(255,255,255,.3);font-size:10px;}

/* ── Inline brief output ── */
.brief-output{background:#fff;border:2px solid #6C63FF;border-radius:16px;padding:28px 32px;margin-top:16px;animation:briefSlideIn .3s ease;}
@keyframes briefSlideIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.brief-header{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.brief-title{font-size:17px;font-weight:800;color:#1f2937;flex:1;}
.brief-sprint-badge{font-size:12px;font-weight:700;color:#6C63FF;background:#ede9fe;padding:4px 12px;border-radius:8px;white-space:nowrap;}
.brief-copy-btn{background:#6C63FF;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:12px;font-weight:700;cursor:pointer;transition:opacity .15s;}
.brief-copy-btn:hover{opacity:.88;}
.brief-section{margin-bottom:18px;}
.brief-section-label{font-size:10px;font-weight:800;color:#9ca3af;text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid #f3f4f6;}
.brief-mtg-item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f9fafb;}
.brief-mtg-item:last-child{border-bottom:none;}
.brief-mtg-time{font-size:11px;font-weight:700;color:#1d4ed8;background:#eff6ff;padding:2px 8px;border-radius:5px;white-space:nowrap;flex-shrink:0;margin-top:1px;}
.brief-mtg-body{flex:1;}
.brief-mtg-title{font-size:13px;font-weight:600;color:#1f2937;}
.brief-mtg-proj{font-size:11px;color:#15803d;font-weight:600;margin-top:2px;}
.brief-note-item{padding:8px 12px;background:#fafafa;border-left:3px solid #6C63FF;border-radius:0 6px 6px 0;margin-bottom:8px;}
.brief-note-meeting{font-size:11px;font-weight:700;color:#6d28d9;margin-bottom:3px;}
.brief-note-text{font-size:12px;color:#374151;line-height:1.6;}
.brief-standup-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:16px 20px;position:relative;}
.brief-standup-text{font-size:13px;color:#1f2937;line-height:1.8;white-space:pre-line;}
.brief-standup-copy{position:absolute;top:10px;right:12px;background:transparent;border:1px solid #bbf7d0;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;color:#15803d;cursor:pointer;}
.brief-standup-copy:hover{background:#d1fae5;}
.brief-no-selection{font-size:13px;color:#9ca3af;text-align:center;padding:20px;}

/* ── Project & Slack channel pills ── */
.proj-cell{padding:12px 12px 12px 14px;border-left:1px solid #f3f4f6;display:flex;align-items:center;}
.proj-badge{display:inline-flex;align-items:center;gap:4px;background:#f0fdf4;color:#15803d;font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;border:1px solid #bbf7d0;white-space:normal;line-height:1.3;}
.proj-unknown{font-size:11px;color:#d1d5db;font-style:italic;}
.slack-cell{padding:12px 12px 12px 14px;border-left:1px solid #f3f4f6;display:flex;align-items:flex-start;flex-wrap:wrap;gap:4px;}
.slack-pill{display:inline-flex;align-items:center;gap:3px;background:#f0f9ff;color:#0369a1;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;border:1px solid #bae6fd;white-space:nowrap;}
.slack-pill::before{content:'#';opacity:.6;}

/* ── Toast ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:14px 28px;border-radius:12px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:560px;line-height:1.5;}
.toast.show{opacity:1;}
</style>

<style id="demoBannerCss">
#pjmDemoBanner{position:fixed;top:0;left:0;right:0;z-index:99999;background:#8A5CFF;color:#fff;
 font:600 12px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding:7px 44px 7px 16px;text-align:center;
 letter-spacing:.2px;box-shadow:0 1px 6px rgba(0,0,0,.18)}
#pjmDemoBanner a{color:#fff;text-decoration:underline}
#pjmDemoBanner button{position:absolute;right:10px;top:4px;background:none;border:none;color:#fff;
 font-size:17px;line-height:1;cursor:pointer;padding:4px}
body.has-demo-banner{padding-top:30px}
</style>
<script id="pjmDemoMode">
/* ===== PUBLIC DEMO BUILD =====
   All data in this build is fictional. No credentials ship with it and no
   outbound calls to third-party APIs are permitted. */
(function(){
  window.PJM_DEMO = true;
  var BLOCK = /(api\.linear\.app|api\.github\.com|graphql|googleapis\.com|slack\.com|atlassian\.net)/i;
  var of = window.fetch;
  window.fetch = function(input){
    var u = (typeof input === 'string') ? input : (input && input.url) || '';
    if (BLOCK.test(u)) {
      console.info('[demo] blocked outbound call:', u);
      return Promise.resolve(new Response(JSON.stringify({data:null,demo:true}),
        {status:200, headers:{'Content-Type':'application/json'}}));
    }
    return of.apply(this, arguments);
  };
  var ox = window.XMLHttpRequest && window.XMLHttpRequest.prototype.open;
  if (ox) window.XMLHttpRequest.prototype.open = function(m,u){
    if (BLOCK.test(String(u))) { console.info('[demo] blocked XHR:', u); u = 'data:application/json,{}'; }
    return ox.apply(this, [m,u].concat([].slice.call(arguments,2)));
  };
  document.addEventListener('DOMContentLoaded', function(){
    if (sessionStorage.getItem('pjmDemoBannerHidden')) return;
    var b = document.createElement('div');
    b.id = 'pjmDemoBanner';
    b.innerHTML = 'DEMO BUILD \u2014 every person, project, ticket and meeting below is fictional. ' +
                  'Live integrations are disabled in this build.' +
                  '<button title="Dismiss" onclick="this.parentNode.remove();' +
                  'document.body.classList.remove(\'has-demo-banner\');' +
                  'sessionStorage.setItem(\'pjmDemoBannerHidden\',\'1\')">&times;</button>';
    document.body.appendChild(b);
    document.body.classList.add('has-demo-banner');
  });
})();
</script>

/* Calendar reader — priority: localStorage → embedded fallback */
function getLiveCalendar(){
  try{
    var raw=localStorage.getItem('pjmdemo_pjm_calendar_v1');
    if(raw){
      var cal=JSON.parse(raw);
      if(cal){
        /* Ensure today array is populated from byDate if needed */
        if((!cal.today||!cal.today.length) && cal.byDate){
          var ist=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Kolkata'}));
          var key=ist.getFullYear()+'-'+String(ist.getMonth()+1).padStart(2,'0')+'-'+String(ist.getDate()).padStart(2,'0');
          cal.today=cal.byDate[key]||[];
          cal.todayCount=cal.today.length;
        }
        if(cal.today&&cal.today.length) return cal;
      }
    }
  }catch(e){}
  /* Fallback: use embedded data (always available, no Meetings tab needed) */
  return PJM_CAL_FALLBACK;
}

/* Parse a raw calendar event (Google Calendar format) into a display object */
function parseCalEvent(ev){
  var startDt=ev.start&&ev.start.dateTime?ev.start.dateTime:(ev.start&&ev.start.date?ev.start.date:null);
  var endDt=ev.end&&ev.end.dateTime?ev.end.dateTime:(ev.end&&ev.end.date?ev.end.date:null);
  var timeStr='TBD';
  var durationStr='';
  if(startDt){
    var sd=new Date(startDt);
    /* Convert to IST */
    var istOpts={timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',hour12:false};
    try{
      var parts=sd.toLocaleTimeString('en-GB',istOpts).split(':');
      var hh=parseInt(parts[0]),mm=parseInt(parts[1]||0);
      var ampm=hh>=12?'PM':'AM';
      var h12=hh%12||12;
      timeStr=(h12<10?'0':'')+h12+':'+(mm<10?'0':'')+mm+' '+ampm;
    }catch(x){timeStr=startDt.slice(11,16);}
    if(endDt){
      var ed=new Date(endDt);
      var mins=Math.round((ed-sd)/60000);
      if(mins>0&&mins<480) durationStr=mins>=60?(Math.floor(mins/60)+'h'+(mins%60?(' '+mins%60+'m'):'')):(mins+' min');
    }
  }
  return {
    time:timeStr,
    title:ev.summary||'Meeting',
    duration:durationStr,
    joinUrl:ev.hangoutLink||ev.conferenceUrl||''
  };
}

function escHtml(s){
  if(!s)return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg,dur){
  var t=document.getElementById('toastEl');
  if(!t)return;
  t.innerHTML=msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},dur||4000);
}

/* ── Sprint hero pill strip ── */
function buildSprintHero(){
  var s=PJMSync.Sprint.current;
  var d=new Date();
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var dateStr=days[d.getDay()]+', '+months[d.getMonth()]+' '+d.getDate()+' '+d.getFullYear();

  /* Build day pills — 10-day sprint, 5 days/week, 2 weeks */
  var totalDays=10;
  var todayNum=((s.week-1)*5)+(s.day);
  var pillsHtml='';
  for(var i=1;i<=totalDays;i++){
    if(i===todayNum) pillsHtml+='<div class="day-pill today" title="Today: Day '+i+'"></div>';
    else if(i<todayNum) pillsHtml+='<div class="day-pill done" title="Day '+i+'"></div>';
    else pillsHtml+='<div class="day-pill" title="Day '+i+'"></div>';
  }

  return '<div class="sprint-hero">'
    +'<div class="sprint-hero-left">'
    +'<div class="sprint-hero-date">'+escHtml(dateStr)+'</div>'
    +'<div class="sprint-hero-badge">▶ Sprint '+s.number+' &nbsp;·&nbsp; Week '+s.week+' &nbsp;·&nbsp; Day '+s.day+'</div>'
    +'<div class="sprint-hero-sub">'+escHtml(s.dates||'')+'</div>'
    +'</div>'
    +'<div class="sprint-progress-ring">'
    +'<div class="sprint-day-pills">'+pillsHtml+'</div>'
    +'<div class="sprint-day-label">Day '+todayNum+' of '+totalDays+'</div>'
    +'</div>'
    +'</div>';
}

/* ── Get meeting notes — priority: localStorage → embedded fallback ── */
function getMeetingNotes(){
  try{
    var raw=localStorage.getItem('pjmdemo_pjm_notes_v1');
    if(raw){var d=JSON.parse(raw);if(d&&d.files&&d.files.length)return d.files;}
  }catch(e){}
  return PJM_NOTES_FALLBACK;
}

/* ── Normalize a meeting title for fuzzy matching ──
   Strips [Del]/[DEL]/[Del.] prefixes, punctuation, extra spaces, lowercases */
function normalizeTitle(t){
  return (t||'')
    .replace(/^\[de[lL][^\]]*\]\s*/gi,'')   /* strip [Del], [DEL], [Del.] */
    .replace(/^\[product\]\s*/gi,'')
    .replace(/[-–—_]/g,' ')                  /* dashes → spaces */
    .replace(/[^\w\s]/g,' ')                 /* strip remaining punctuation */
    .replace(/\s+/g,' ')
    .trim()
    .toLowerCase();
}

/* Score two normalized strings: 0–1 based on shared meaningful words */
function titleScore(a, b){
  var STOP=['the','and','for','with','from','this','that','weekly','daily','standup','sync','call','meeting','update','internal','regular','monthly'];
  function words(s){ return s.split(' ').filter(function(w){return w.length>2 && STOP.indexOf(w)===-1;}); }
  var wa=words(a), wb=words(b);
  if(!wa.length||!wb.length) return 0;
  var hits=0;
  wa.forEach(function(w){ if(wb.indexOf(w)!==-1) hits++; });
  return hits / Math.max(wa.length, wb.length);
}

/* ── Find best matching note for a meeting title ──
   Returns the most-recent note with score > threshold, never future-dated */
function matchNote(meetingTitle){
  var notes=getMeetingNotes();
  if(!notes||!notes.length) return null;
  var mNorm=normalizeTitle(meetingTitle);
  var today=new Date(); today.setHours(23,59,59,999);
  var best=null, bestScore=0, bestDate=null;
  notes.forEach(function(n){
    if(!n.summary) return; /* skip notes with no summary */
    var nd=new Date(n.date);
    if(nd>today) return;   /* skip future notes */
    var nNorm=normalizeTitle(n.title);
    /* Score: exact > substring > word-overlap */
    var score=0;
    if(nNorm===mNorm) score=1.0;
    else if(nNorm.indexOf(mNorm)!==-1||mNorm.indexOf(nNorm)!==-1) score=0.85;
    else score=titleScore(mNorm, nNorm);
    /* Among equal-score matches prefer most recent */
    if(score>0.3){
      if(score>bestScore||(score===bestScore&&(!bestDate||nd>bestDate))){
        bestScore=score; best=n; bestDate=nd;
      }
    }
  });
  return best;
}

/* ── Project & Slack channel lookup from meeting title ── */
function getProjectInfo(title){
  var t=(title||'').toLowerCase();
  /* Agentic Atlas Pro — check before generic "marketplace" */
  if(t.includes('atlas pro')||t.includes('agentic atlas pro')||
     t.includes('happy path')||(t.includes('marketplace')&&t.includes('pro')))
    return {project:'Agentic Atlas Pro',channels:['360-degrees-of-jover','agentic-human-dev-planning']};
  /* Agentic Marketplace Lite */
  if(t.includes('marketplace lite')||t.includes('marketplace light')||
     t.includes('agentic marketplace lite'))
    return {project:'Agentic Marketplace Lite',channels:['agentic-marketplace-lite']};
  /* Harness */
  if(t.includes('harness'))
    return {project:'DRIFT Harness',channels:['drift-harness']};
  /* CEX + DEX combined */
  if(t.includes('cex')&&t.includes('dex'))
    return {project:'Market Maker Product',channels:['ember-cex-dev','ember-dex-dev']};
  /* CEX only */
  if(t.includes('cex'))
    return {project:'Market Maker Product',channels:['ember-cex-dev']};
  /* DEX only */
  if(t.includes('dex'))
    return {project:'Market Maker Product',channels:['ember-dex-dev']};
  /* EMBER / Market Maker */
  if(t.includes('ember')||t.includes('market maker'))
    return {project:'Market Maker Product',channels:['ember','ember-dev']};
  /* ATLAS / MBP / AdOps / AdServer */
  if(t.includes('amp')||t.includes('mbp/amp')||t.includes('mbp amp')||
     t.includes('adops')||t.includes('adserver')||t.includes('ad server')||
     (t.includes('amp')&&!t.includes('agentic')))
    return {project:'Meridian Media Platform',channels:['amp','amp-dev']};
  /* Labs */
  if(t.includes('labs v4')||t.includes('labs daily')||
     t.includes('meridian labs')||(t.includes('labs')&&!t.includes('adlabs')))
    return {project:'Meridian Labs',channels:['pjmdemo_labs']};
  /* Beacon */
  if(t.includes('beacon')||t.includes('ad fi'))
    return {project:'Beacon',channels:['beacon','beacon-dev']};
  /* BEACON */
  if(t.includes(' beacon')||t.startsWith('beacon'))
    return {project:'BEACON',channels:['beacon-dev']};
  /* Exchange */
  if(t.includes('exchange')&&!t.includes('adtech')&&!t.includes('ad tech'))
    return {project:'Exchange',channels:['exchange-dev']};
  /* AdTech umbrella (BEACON + Exchange + Beacon) */
  if(t.includes('adtech')||t.includes('ad tech')||t.includes('clustered env'))
    return {project:'BEACON · Exchange · Beacon',channels:['beacon-dev','exchange-dev','beacon-dev']};
  /* DevOps */
  if(t.includes('devops')||t.includes('dev ops'))
    return {project:'DevOps',channels:['devops']};
  return null;
}

function buildMeetingsWithNotes(){
  var cal=getLiveCalendar();
  var isLiveCal=!!(cal&&cal.today&&cal.today.length);
  var hasNotes=getMeetingNotes().length>0;
  var meetings=[];

  if(isLiveCal){
    meetings=cal.today.map(parseCalEvent);
  } else {
    /* No calendar data for today — show an honest empty state rather than placeholders. */
    meetings=[];
  }

  /* Column header */
  var liveTags='';
  if(isLiveCal) liveTags+=' <span class="live-badge">🟢 CALENDAR</span>';
  if(hasNotes) liveTags+=' <span class="live-badge" style="background:#ede9fe;color:#6d28d9;">🟣 NOTES</span>';

  var html='<div class="sb-card">'
    +'<div class="sb-card-title">📅 Meetings Today'+liveTags+'</div>';

  if(!meetings.length){
    html+='<p style="font-size:13px;color:#9ca3af;">No meetings scheduled today.</p>';
  } else {
    /* Populate module-level store */
    _todayMeetings=meetings.map(function(m){
      return {m:m, note:matchNote(m.title), proj:getProjectInfo(m.title)};
    });

    /* Five-col header (checkbox + 4 data cols) */
    var hStyle='font-size:11px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.5px;padding-bottom:6px;border-bottom:2px solid #f3f4f6;';

      +'<div style="'+hStyle+' text-align:center;">✓</div>'
      +'<div style="'+hStyle+'">Meeting</div>'
      +'<div style="'+hStyle+' padding-left:16px;">Last Meeting Note</div>'
      +'<div style="'+hStyle+' padding-left:14px;">Project</div>'
      +'<div style="'+hStyle+' padding-left:14px;">Slack Channel</div>'
      +'</div>';

    meetings.forEach(function(m, idx){
      var note=matchNote(m.title);
      var proj=getProjectInfo(m.title);

      /* Col 0: radio (single-select) — first row pre-selected */
      var chkHtml='<div class="mtg-chk-cell"><input type="radio" name="mtgSelect" class="mtg-chk mtg-row-chk" data-idx="'+idx+'"'+(idx===0?' checked':'')+' onchange="onRowSelect(this)"></div>';

      /* Col 1: meeting info */
      var leftHtml='<div class="mtg-left">'
        +'<span class="meeting-time">'+escHtml(m.time)+'</span>'
        +'<div style="flex:1;min-width:0;">'
        +'<div class="meeting-title">'+escHtml(m.title)+'</div>'
        +(m.duration?'<div class="meeting-dur" style="margin-top:2px;">'+escHtml(m.duration)+'</div>':'')
        +'</div>'
        +(m.joinUrl?'<a href="'+escHtml(m.joinUrl)+'" target="_blank" class="join-btn">🎥 Join</a>':'')
        +'</div>';

      /* Col 2: note panel */
      var rightHtml='<div class="mtg-right">';
      if(!note){
        rightHtml+='<div class="note-empty">No notes found for this meeting</div>';
      } else {
        var noteDateStr='';
        if(note.date){
          var nd=new Date(note.date+'T00:00:00');
          var dnames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
          var mnames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          noteDateStr=dnames[nd.getDay()]+' '+mnames[nd.getMonth()]+' '+nd.getDate();
        }
        rightHtml+='<div class="note-panel">'
          +'<div class="note-source-row">'
          +(noteDateStr?'<span class="note-badge-date">'+escHtml(noteDateStr)+'</span>':'')
          +'<span class="note-badge-src">Gemini Notes</span>'
          +(note.viewUrl?'<a href="'+escHtml(note.viewUrl)+'" target="_blank" style="font-size:10px;font-weight:700;color:#3b82f6;text-decoration:none;margin-left:auto;flex-shrink:0;">📄 Full Notes</a>':'')
          +'</div>'
          +(note.summary?'<div class="note-summary-text">'+escHtml(note.summary)+'</div>':'')
          +'</div>';
      }
      rightHtml+='</div>';

      /* Col 3: project */
      var projHtml='<div class="proj-cell">';
      if(proj){
        projHtml+='<span class="proj-badge">'+escHtml(proj.project)+'</span>';
      } else {
        projHtml+='<span class="proj-unknown">—</span>';
      }
      projHtml+='</div>';

      /* Col 4: slack channels */
      var slackHtml='<div class="slack-cell">';
      if(proj&&proj.channels&&proj.channels.length){
        proj.channels.forEach(function(ch){
          slackHtml+='<span class="slack-pill">'+escHtml(ch)+'</span>';
        });
      } else {
        slackHtml+='<span class="proj-unknown">—</span>';
      }
      slackHtml+='</div>';

      html+='<div class="mtg-note-row'+(idx===0?' row-selected':'')+'" data-idx="'+idx+'">'+chkHtml+leftHtml+rightHtml+projHtml+slackHtml+'</div>';
    });
  }

  return html+'</div>';
}

/* ── Single-select radio helpers ── */
function onRowSelect(radio){
  /* Highlight only the selected row */
  document.querySelectorAll('.mtg-note-row').forEach(function(row){
    row.classList.remove('row-selected');
  });
  var row=radio.closest('.mtg-note-row');
  if(row) row.classList.add('row-selected');
}

function getSelectedMeetings(){
  var radio=document.querySelector('.mtg-row-chk:checked');
  if(!radio) return [];
  var idx=parseInt(radio.getAttribute('data-idx'));
  if(!isNaN(idx)&&_todayMeetings[idx]) return [_todayMeetings[idx]];
  return [];
}

  lines.push('TODAY\'S MEETINGS ('+selected.length+' selected)');
  selected.forEach(function(item){
    lines.push('• '+item.m.time+' — '+item.m.title+(item.proj?' ['+item.proj.project+']':''));
  });
  if(notesWithContent.length){
    lines.push('');
    lines.push('CONTEXT FROM LAST MEETINGS');
    notesWithContent.forEach(function(item){
      lines.push('• '+item.m.title+': "'+item.note.summary+'"');
    });
  }
  if(projectList.length){
    lines.push('');
    lines.push('PROJECTS IN FOCUS: '+projectList.join(' · '));
  }
  var standupText=lines.join('\n');

  return '<div class="brief-output">'
    +'<div class="brief-header">'
    +'<span style="font-size:20px;">🎙️</span>'
    +'<div class="brief-title">Standup Brief</div>'
    +'<span class="brief-sprint-badge">'+escHtml(sprintStr)+'</span>'
    +'<button class="brief-copy-btn" onclick="copyBriefText()">📋 Copy Brief</button>'
    +'</div>'

    +'<div class="brief-section">'
    +'<div class="brief-section-label">Meetings Today ('+selected.length+' selected)</div>'
    +mtgHtml
    +'</div>'

    +'<div class="brief-section">'
    +'<div class="brief-section-label">Context from Last Meetings</div>'
    +notesHtml
    +'</div>'

    +'<div class="brief-section">'
    +'<div class="brief-section-label">Quick Standup Text <span style="font-size:10px;font-weight:500;color:#c4b5fd;">(ready to copy & paste)</span></div>'
    +'<div class="brief-standup-box">'
    +'<button class="brief-standup-copy" onclick="copyBriefText()">📋 Copy</button>'
    +'<div class="brief-standup-text" id="briefStandupText">'+escHtml(standupText)+'</div>'
    +'</div>'
    +'</div>'
    +'</div>';
}

var _lastBriefText='';

function copyBriefText(){
  var el=document.getElementById('briefStandupText');
  var text=el?el.textContent:_lastBriefText;
  navigator.clipboard.writeText(text).then(function(){
    showToast('✅ Brief copied to clipboard!',3000);
  }).catch(function(){
    if(el){el.focus();var r=document.createRange();r.selectNode(el);window.getSelection().removeAllRanges();window.getSelection().addRange(r);}
    showToast('⚠️ Select the text and copy manually.',3000);
  });
}

/* ── Generate brief context for Claude ── */
function buildBriefContext(){
  var s=PJMSync.Sprint.current;
  var d=new Date();
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var dateStr=days[d.getDay()]+', '+months[d.getMonth()]+' '+d.getDate()+' '+d.getFullYear();

  var jira=getLiveJira();
  var cal=getLiveCalendar();
  var gemini=getLiveGemini();
  var slack=getLiveSlack();
  var tasks=loadTasks();

  var lines=[];
  lines.push('=== PJM STANDUP CONTEXT ===');
  lines.push('Date: '+dateStr);
  lines.push('Sprint: '+s.number+' · Week '+s.week+' · Day '+s.day+(s.dates?' ('+s.dates+')':''));
  lines.push('');

  /* Sprint status */
  lines.push('--- SPRINT STATUS ---');
  if(jira&&jira.projects&&Object.keys(jira.projects).length){
    Object.keys(jira.projects).forEach(function(key){
      var p=jira.projects[key];
      var pct=p.total>0?Math.round(p.done/p.total*100):0;
      lines.push(key+': '+p.done+'/'+p.total+' done ('+pct+'%)'+(p.inProgress?' | '+p.inProgress+' in progress':''));
    });
    if(jira.blockers&&jira.blockers.length){
      lines.push('Blockers: '+jira.blockers.slice(0,5).map(function(b){return '['+b.key+'] '+b.summary;}).join(' | '));
    }
  } else {
    lines.push('JIRA data not synced — run Data Pump for live status');
  }
  lines.push('');

  /* Meetings today */
  lines.push('--- MEETINGS TODAY ---');
  if(cal&&cal.today&&cal.today.length){
    cal.today.forEach(function(ev){
      var m=parseCalEvent(ev);
      lines.push(m.time+' — '+m.title+(m.duration?' ('+m.duration+')':''));
    });
  } else {
    lines.push('Calendar not synced');
  }
  lines.push('');

  /* Last meeting note */
  lines.push('--- LAST MEETING NOTE ---');
  if(gemini&&gemini.notes&&gemini.notes.length){
    var note=gemini.notes[0];
    lines.push('Meeting: '+(note.meetingTitle||'Unknown')+(note.date?' | '+note.date:''));
    if(note.summary) lines.push('Summary: '+note.summary);
    if(note.actionItems&&note.actionItems.length){
      lines.push('Action items:');
      note.actionItems.forEach(function(ai){lines.push('  - '+ai);});
    }
    /* Additional notes */
    if(gemini.notes.length>1){
      lines.push('');
      lines.push('Previous notes:');
      gemini.notes.slice(1,3).forEach(function(n){
        lines.push('  ['+n.meetingTitle+(n.date?' · '+n.date:'')+'] '+(n.summary||'').slice(0,120));
      });
    }
  } else {
    lines.push('No meeting notes synced yet');
  }
  lines.push('');

  /* Open action items */
  lines.push('--- OPEN ACTION ITEMS ---');
  var pending=tasks.filter(function(t){return t.status==='pending';});
  if(pending.length){
    pending.slice(0,8).forEach(function(t,i){
      lines.push((i+1)+'. ['+t.priority.toUpperCase()+'] '+t.title+(t.source?' ('+t.source+')':''));
    });
  } else {
    lines.push('No open action items');
  }
  lines.push('');

  /* Slack highlights */
  if(slack&&slack.highlights&&slack.highlights.length){
    lines.push('--- SLACK HIGHLIGHTS ---');
    slack.highlights.slice(0,4).forEach(function(h){
      lines.push('  #'+(h.channel||'general')+': '+(h.text||'').slice(0,120));
    });
    lines.push('');
  }

  lines.push('=== END CONTEXT ===');
  lines.push('');
  lines.push('Please generate my standup brief using the above context.');

  return lines.join('\n');
}

/* ── Generate button zone ── */

    +'<div class="generate-zone-title">⚡ Generate Your Standup Brief</div>'
    +'<div class="generate-zone-sub">Select a meeting · click Generate · Claude opens in the next tab with everything pre-loaded · just press <strong style="color:#c7d2fe;">Ctrl+V → Enter</strong></div>'
    +'<div class="workflow-steps">'

    +'<div class="ws-arrow">→</div>'
    +'<div class="ws"><div class="ws-num">3</div><span>Claude tab opens</span></div>'

/* ── Build the Claude message (skill invocation + full context) ── */
function buildClaudeMessage(item){
  var s=PJMSync.Sprint.current;
  var d=new Date();
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var dateStr=days[d.getDay()]+', '+months[d.getMonth()]+' '+d.getDate()+' '+d.getFullYear();
  var sprintStr='Sprint '+s.number+' | Week '+s.week+' | Day '+s.day+' | '+s.dates;

  var m=item.m;
  var note=item.note;
  var proj=item.proj;

  var lines=[];
  lines.push('/standup-briefing');
  lines.push('');
  lines.push('Here is my standup context for today. Please generate a complete standup brief HTML for me.');
  lines.push('');
  lines.push('--- MEETING ---');
  lines.push('Title: '+m.title);
  lines.push('Time: '+m.time+(m.duration?' | Duration: '+m.duration:''));
  if(proj){
    lines.push('Project: '+proj.project);
    lines.push('Slack Channels: '+proj.channels.map(function(c){return '#'+c;}).join('  '));
  }
  lines.push('');
  lines.push('--- SPRINT CONTEXT ---');
  lines.push(sprintStr);
  lines.push('Date: '+dateStr);
  lines.push('');
  if(note){
    lines.push('--- LAST MEETING NOTES ---');
    lines.push('From: '+note.title+(note.date?' ('+note.date+')':''));
    if(note.summary) lines.push('Summary: '+note.summary);
    if(note.viewUrl) lines.push('Full notes link: '+note.viewUrl);
    lines.push('');
  }
  lines.push('--- WHAT I NEED ---');
  lines.push('1. Pull the full meeting notes from the link above');
  lines.push('2. Generate a standup brief covering: what was discussed, key decisions, action items, and what I should focus on today');
  lines.push('3. Include the project name and Slack channels where follow-ups should be posted');
  lines.push('4. Output as a clean HTML snippet I can copy into Slack or email');

  return lines.join('\n');
}

/* ── Main generate action — opens claude.ai with context ready to paste ── */
function generateBrief(){
  var btn=document.getElementById('genBtn');
  if(btn){btn.disabled=true;btn.innerHTML='Opening Claude…';}

  var selected=getSelectedMeetings();
  if(!selected.length){
    showToast('⚠️ Select a meeting first',2500);
    if(btn){btn.disabled=false;btn.innerHTML='⚡ Generate Brief';}
    return;
  }

  var item=selected[0];
  var message=buildClaudeMessage(item);

  /* 1. Copy message to clipboard */
  var doCopy=function(text, onDone){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(onDone).catch(onDone);
    } else {
      /* Fallback for non-secure context */
      var ta=document.createElement('textarea');
      ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy');}catch(e){}
      document.body.removeChild(ta);
      onDone();
    }
  };

  doCopy(message, function(){
    /* 2. Show inline brief preview */
    var briefHtml=buildInlineBrief(selected);
    var out=document.getElementById('briefOutput');
    if(out){ out.innerHTML=briefHtml; }

    /* 3. Open claude.ai in new tab */
    var claudeTab=window.open('https://claude.ai/new','_blank');

    /* 4. Show paste instruction overlay on THIS page */
    showPasteOverlay(item, claudeTab);

    PJMSync.markSynced(MODULE_ID,{ts:Date.now()});
    if(btn){btn.disabled=false;btn.innerHTML='⚡ Generate Brief';}
  });
}

/* ── Paste instruction overlay ── */

  var overlay=document.createElement('div');
  overlay.id='pasteOverlay';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(17,24,39,.75);z-index:9990;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);';

  overlay.innerHTML=
    '<div style="background:#fff;border-radius:20px;padding:36px 40px;max-width:520px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);">'
    /* Icon */
    +'<div style="width:64px;height:64px;background:linear-gradient(135deg,#6C63FF,#3B82F6);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 20px;">🎙️</div>'
    /* Title */
    +'<div style="font-size:20px;font-weight:800;color:#1f2937;margin-bottom:8px;">Claude is ready!</div>'
    +'<div style="font-size:14px;color:#6b7280;margin-bottom:24px;">Your standup context is on the clipboard.<br>Switch to the Claude tab and paste.</div>'
    /* Paste instruction */
    +'<div style="background:#f5f3ff;border:2px solid #6C63FF;border-radius:12px;padding:16px 24px;margin-bottom:24px;">'
    +'<div style="font-size:13px;color:#6d28d9;font-weight:700;margin-bottom:6px;">In the Claude tab:</div>'
    +'<div style="font-size:22px;font-weight:900;color:#1f2937;letter-spacing:2px;">Ctrl + V &nbsp;→&nbsp; Enter</div>'
    +'<div style="font-size:12px;color:#9ca3af;margin-top:6px;">(Mac: ⌘ + V)</div>'
    +'</div>'
    /* Context summary */
    +'<div style="background:#f9fafb;border-radius:10px;padding:12px 16px;margin-bottom:24px;text-align:left;">'
    +'<div style="font-size:11px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;">What Claude will receive</div>'
    +'<div style="font-size:12px;color:#374151;display:flex;flex-direction:column;gap:5px;">'
    +'<div>📅 <strong>Meeting:</strong> '+escHtml(m.title)+'</div>'
    +(proj?'<div>🏷 <strong>Project:</strong> '+escHtml(proj.project)+'</div>':'')
    +(proj?'<div>💬 <strong>Slack:</strong> '+proj.channels.map(function(c){return'<span style="background:#dbeafe;color:#1d4ed8;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:700;">#'+escHtml(c)+'</span>';}).join(' ')+'</div>':'')
    +'<div>🔁 <strong>Skill:</strong> <span style="background:#ede9fe;color:#6d28d9;padding:1px 8px;border-radius:4px;font-size:11px;font-weight:700;">/standup-briefing</span></div>'
    +'</div>'
    +'</div>'
    /* Buttons */
    +'<div style="display:flex;gap:10px;justify-content:center;">'
    +'<button onclick="if(window.__claudeTab)window.__claudeTab.focus();document.getElementById(\'pasteOverlay\').remove();" style="background:linear-gradient(135deg,#6C63FF,#3B82F6);color:#fff;border:none;border-radius:10px;padding:12px 28px;font-size:14px;font-weight:700;cursor:pointer;flex:1;">Switch to Claude tab →</button>'
    +'<button onclick="document.getElementById(\'pasteOverlay\').remove();" style="background:#f3f4f6;color:#374151;border:none;border-radius:10px;padding:12px 20px;font-size:13px;font-weight:600;cursor:pointer;">✕ Close</button>'
    +'</div>'
    +'</div>';

  window.__claudeTab=claudeTab;
  document.body.appendChild(overlay);

  /* Auto-dismiss after 25s */
  setTimeout(function(){
    var el=document.getElementById('pasteOverlay');
    if(el) el.remove();
  },25000);
}

/* ── Render all ── */
function render(){
  var html='';
  html+=buildSprintHero();
  html+=buildMeetingsWithNotes();
  html+=buildGenerateZone();
  html+='<div id="briefOutput"></div>'; /* Inline brief renders here */
  document.getElementById('moduleContent').innerHTML=html;
}

function doSync(){
  PJMSync.setSyncBtnState(true);
  setTimeout(function(){
    render();
    PJMSync.setSyncBtnState(false);
    PJMSync.markSynced(MODULE_ID,{ts:Date.now()});
  },300);
}

document.addEventListener('DOMContentLoaded',function(){
  PJMNav.render(MODULE_ID);
  PJMSync.initModule(MODULE_ID,doSync);
  render();
});
</script>
