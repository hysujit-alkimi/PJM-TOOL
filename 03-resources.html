.sub-tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:2px solid var(--border);overflow-x:auto}
.sub-tab{padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;white-space:nowrap}

.sub-tab:hover{color:var(--text)}
.kpi-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:24px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.kpi-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi-value{font-size:28px;font-weight:800;line-height:1}
.kpi-sub{font-size:12px;color:var(--muted);margin-top:4px}
.kpi-card.blue .kpi-value{color:#3b82f6}
.kpi-card.green .kpi-value{color:#10b981}
.kpi-card.orange .kpi-value{color:#f59e0b}
.kpi-card.purple .kpi-value{color:#8b5cf6}
.load-legend{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.ll-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 20px;flex:1;min-width:160px;display:flex;align-items:center;gap:12px}
.ll-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.ll-info .ll-label{font-size:13px;font-weight:700}
.ll-info .ll-range{font-size:11px;color:var(--muted)}
.ll-count{margin-left:auto;font-size:24px;font-weight:800}
.filter-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-bar select,.filter-bar input{height:34px;padding:0 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);color:var(--text);outline:none}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--primary)}
.chart-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:24px}
.chart-title{font-size:14px;font-weight:700;margin-bottom:14px}
.resource-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.resource-table th{padding:10px 14px;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;border-bottom:1px solid var(--border);text-align:left;background:var(--bg)}

.resource-table tr:last-child td{border-bottom:none}

.load-badge.balanced{background:#fef3c7;color:#92400e}
.load-badge.overloaded{background:#fee2e2;color:#b91c1c}
.mini-bar{height:5px;border-radius:3px;background:var(--border);overflow:hidden;width:80px;display:inline-block;vertical-align:middle;margin-left:8px}
.mini-bar-fill{height:100%;border-radius:3px}
.team-chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;color:#fff;display:inline-block}
.lead-crown{font-size:12px;margin-left:4px}

<script id="pjmDemoMode">
/* ===== PUBLIC DEMO BUILD =====
   All data in this build is fictional. No credentials ship with it and no
   outbound calls to third-party APIs are permitted. */
(function(){
  window.PJM_DEMO = true;
  var BLOCK = /(api\.linear\.app|api\.github\.com|graphql|googleapis\.com|slack\.com|atlassian\.net)/i;
  var of = window.fetch;
  window.fetch = function(input){
    var u = (typeof input === 'string') ? input : (input && input.url) || '';
    if (BLOCK.test(u)) {
      console.info('[demo] blocked outbound call:', u);
      return Promise.resolve(new Response(JSON.stringify({data:null,demo:true}),
        {status:200, headers:{'Content-Type':'application/json'}}));
    }
    return of.apply(this, arguments);
  };
  var ox = window.XMLHttpRequest && window.XMLHttpRequest.prototype.open;
  if (ox) window.XMLHttpRequest.prototype.open = function(m,u){
    if (BLOCK.test(String(u))) { console.info('[demo] blocked XHR:', u); u = 'data:application/json,{}'; }
    return ox.apply(this, [m,u].concat([].slice.call(arguments,2)));
  };
  document.addEventListener('DOMContentLoaded', function(){
    if (sessionStorage.getItem('pjmDemoBannerHidden')) return;
    var b = document.createElement('div');
    b.id = 'pjmDemoBanner';
    b.innerHTML = 'DEMO BUILD \u2014 every person, project, ticket and meeting below is fictional. ' +
                  'Live integrations are disabled in this build.' +
                  '<button title="Dismiss" onclick="this.parentNode.remove();' +
                  'document.body.classList.remove(\'has-demo-banner\');' +
                  'sessionStorage.setItem(\'pjmDemoBannerHidden\',\'1\')">&times;</button>';
    document.body.appendChild(b);
    document.body.classList.add('has-demo-banner');
  });
})();
</script>

function renderDeepDiveTab(){
  // ── Selectors ──────────────────────────────────────────────────────────────
  const teamOpts=teams.map(t=>`<option value="${t}"${ddTeamFilter===t?' selected':''}>${t}</option>`).join('');
  const teamPeople=ddTeamFilter==='ALL'?teamMembers:teamMembers.filter(m=>m.team===ddTeamFilter);
  const personOpts=teamPeople.map(m=>`<option value="${m.name}"${ddPersonFilter===m.name?' selected':''}>${m.name}${m.lead?' 👑':''}</option>`).join('');

  let html=`
  <div class="filter-bar">
    <select onchange="ddTeamFilter=this.value;ddPersonFilter='';switchTab('deepdive')">
      <option value="ALL"${ddTeamFilter==='ALL'?' selected':''}>All Teams</option>
      ${teamOpts}
    </select>
    <select onchange="ddPersonFilter=this.value;switchTab('deepdive')" ${ddTeamFilter==='ALL'&&!ddPersonFilter?'disabled':''}>
      <option value="">— Select Resource —</option>
      ${personOpts}
    </select>
  </div>`;

  // ── Placeholder ─────────────────────────────────────────────────────────────
  if(!ddPersonFilter){
    html+=`<div class="dd-placeholder">
      <div class="ph-icon">🔍</div>
      <p><strong>Select a team and resource</strong> to see their project × status breakdown.</p>
    </div>`;
    return html;
  }

  // ── Person data ──────────────────────────────────────────────────────────────
  const member=teamMembers.find(m=>m.name===ddPersonFilter);
  const bd=personBreakdown[ddPersonFilter]||{};
  const load=member?getLoad(member.jiraTickets):'available';
  const loadLabel=member?getLoadLabel(member.jiraTickets):'—';
  const teamColor=member?(teamColors[member.team]||'#64748b'):'#64748b';
  const totalTickets=member?member.jiraTickets:0;

  // Collect all statuses this person has
  const allStatuses=new Set();
  Object.values(bd).forEach(proj=>Object.keys(proj).forEach(s=>allStatuses.add(s)));

  // Ordered columns — show only those with data
  const colOrder=['In Progress','In Review','System Testing','Dev Completed','Todo','Backlog','Hold or Blocked','Ready to Release'];
  const extraCols=[...allStatuses].filter(s=>!colOrder.includes(s)).sort();
  const cols=[...colOrder,...extraCols].filter(s=>allStatuses.has(s));

  // Column header CSS class
  const colClass={'In Progress':'th-active','In Review':'th-review','System Testing':'th-testing',
    'Dev Completed':'th-done','Todo':'th-todo','Backlog':'th-backlog',
    'Hold or Blocked':'th-blocked','Ready to Release':'th-rtr'};
  const cellClass={'In Progress':'cell-ip','System Testing':'cell-st',
    'Hold or Blocked':'cell-bl','Ready to Release':'cell-rtr','Dev Completed':'cell-dc'};

  // Compute active tickets (excl RTR) for header stat
  let activeCount=0,rtrCount=0,backlogCount=0;
  Object.values(bd).forEach(proj=>{
    Object.entries(proj).forEach(([s,c])=>{
      if(s==='Ready to Release') rtrCount+=c;
      else if(s==='Backlog') backlogCount+=c;
      else activeCount+=c;
    });
  });

  // Sort projects: No Project last, others by total desc
  const projects=Object.keys(bd).filter(p=>p!=='No Project').sort((a,b)=>{
    const ta=Object.values(bd[a]).reduce((s,v)=>s+v,0);
    const tb=Object.values(bd[b]).reduce((s,v)=>s+v,0);
    return tb-ta;
  });
  if(bd['No Project']) projects.push('No Project');

  // Column totals
  const colTotals={};
  cols.forEach(c=>{colTotals[c]=0;});
  let grandTotal=0;

  // ── Header card ──────────────────────────────────────────────────────────────
  html+=`<div class="dd-header">
    <div>
      <div class="dd-name">${ddPersonFilter}${member&&member.lead?' 👑':''}
        <span class="dd-team-chip" style="background:${teamColor}">${member?member.team:'—'}</span>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">${member&&member.projects.length>0?member.projects.join(', '):'No projects assigned'}</div>
    </div>
    <div class="dd-stats" style="margin-left:auto;display:flex;gap:0">
      <div class="dd-stat"><div class="dd-stat-val" style="color:#3b82f6">${activeCount}</div><div class="dd-stat-lbl">Active</div></div>
      <div class="dd-stat"><div class="dd-stat-val" style="color:#64748b">${backlogCount}</div><div class="dd-stat-lbl">Backlog</div></div>
      <div class="dd-stat"><div class="dd-stat-val" style="color:#f59e0b">${rtrCount}</div><div class="dd-stat-lbl">Ready to Release</div></div>
      <div class="dd-stat"><div class="dd-stat-val">${activeCount+backlogCount+rtrCount}</div><div class="dd-stat-lbl">Total</div></div>
      <div class="dd-stat"><span class="load-badge ${load}">${loadLabel}</span></div>
    </div>
  </div>`;

  // ── Matrix table ─────────────────────────────────────────────────────────────
  html+=`<div class="dd-table-wrap"><table class="dd-table">
    <thead><tr>
      <th>Project</th>
      ${cols.map(c=>`<th class="${colClass[c]||''}">${c}</th>`).join('')}
      <th>Total</th>
    </tr></thead>
    <tbody>`;

  projects.forEach(proj=>{
    const statuses=bd[proj]||{};
    const rowTotal=Object.values(statuses).reduce((s,v)=>s+v,0);
    grandTotal+=rowTotal;
    const hasActive=(statuses['In Progress']||0)+(statuses['In Review']||0)+(statuses['System Testing']||0)>0;
    html+=`<tr class="${hasActive?'row-active':''}">
      <td>${proj==='No Project'?'<em style="color:var(--muted)">— Unassigned —</em>':proj}</td>
      ${cols.map(c=>{
        const v=statuses[c]||0;
        colTotals[c]+=v;
        const cc=cellClass[c]||'';
        return `<td class="${v===0?'cell-zero':cc}">${v===0?'·':v}</td>`;
      }).join('')}
      <td style="font-weight:700">${rowTotal}</td>
    </tr>`;
  });

  html+=`</tbody><tfoot><tr>
    <td>Total</td>
    ${cols.map(c=>{
      const v=colTotals[c]||0;
      const cc=cellClass[c]||'';
      return `<td class="${v===0?'cell-zero':cc}">${v===0?'·':v}</td>`;
    }).join('')}
    <td>${grandTotal}</td>
  </tr></tfoot></table></div>`;

  // ── Legend ────────────────────────────────────────────────────────────────────
  html+=`<div style="font-size:11px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap">
    <span style="color:#3b82f6">■ In Progress</span>
    <span style="color:#6d28d9">■ System Testing</span>
    <span style="color:#059669">■ Dev Completed</span>
    <span style="color:#ef4444">■ Hold or Blocked</span>
    <span style="color:#d97706">■ Ready to Release</span>
    <span style="background:#eff6ff;border-left:3px solid #3b82f6;padding:0 4px">Highlighted row = has active work</span>
  </div>`;

  return html;
}

function switchTab(tab){
  activeTab=tab;
  renderAll();
}

function renderAll(){
  let content='';
  content+=renderTabBar();

  switch(activeTab){
    case 'overview':   content+=renderOverviewTab();   break;
    case 'workload':   content+=renderWorkloadTab();   break;
    case 'bandwidth':  content+=renderBandwidthTab();  break;
    case 'matrix':     content+=renderMatrixTab();     break;
    case 'structure':  content+=renderStructureTab();  break;
    case 'orgchart':   content+=renderOrgChart();      break;
    case 'deepdive':   content+=renderDeepDiveTab();   break;
  }

  document.getElementById('moduleContent').innerHTML=content;

  // Init charts after DOM update
  if(activeTab==='overview'){
    const ctx=document.getElementById('teamBarChart');
    if(ctx){
      if(barChartInstance){barChartInstance.destroy();barChartInstance=null;}
      const teamCounts={};
      teamMembers.forEach(m=>{teamCounts[m.team]=(teamCounts[m.team]||0)+1;});
      const labels=Object.keys(teamCounts);
      const data=Object.values(teamCounts);
      const colors=labels.map(l=>teamColors[l]||'#64748b');
      barChartInstance=new Chart(ctx,{type:'bar',data:{labels,datasets:[{data,backgroundColor:colors,borderRadius:6}]},options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{grid:{display:false}}}}});
    }
  }
  if(activeTab==='workload'){
    const ctx=document.getElementById('workloadBarChart');
    if(ctx){
      const filtered=workloadTeamFilter==='ALL'?teamMembers:teamMembers.filter(m=>m.team===workloadTeamFilter);
      const top20=[...filtered].sort((a,b)=>b.jiraTickets-a.jiraTickets).slice(0,20);
      const colors=top20.map(m=>{const l=getLoad(m.jiraTickets);return l==='available'?'#10b981':l==='balanced'?'#f59e0b':'#ef4444';});
      new Chart(ctx,{type:'bar',data:{labels:top20.map(m=>m.name),datasets:[{data:top20.map(m=>m.jiraTickets),backgroundColor:colors,borderRadius:4}]},options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{grid:{display:false},ticks:{font:{size:11}}}}}});
    }
  }
}

function doSync(){
  if(typeof PJMSync!=='undefined'){
    PJMSync.setSyncBtnState(true);
    PJMSync.markLoading(MODULE_ID);
    setTimeout(()=>{
      PJMSync.markSynced(MODULE_ID,{team:teamMembers.length,note:'Linear ticket counts — last full sync 30 Sep 2026'});
      PJMSync.setSyncBtnState(false);
      renderAll();
    },600);
  } else {
    renderAll();
  }
}

document.addEventListener('DOMContentLoaded',function(){
  PJMNav.render(MODULE_ID);
  PJMSync.initModule(MODULE_ID,doSync);
  renderAll();
});
</script>
